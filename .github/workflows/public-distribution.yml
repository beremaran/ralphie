name: Public distribution

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# The check is intentionally read-only. It must continue to prove that all
# public channels work without an Actions or user GitHub token.
permissions: {}

jobs:
  verify:
    name: Verify public distribution anonymously
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The standalone installer intentionally requires Sigstore. Keep this
      # tool in an ephemeral venv rather than adding it to the product image
      # or relying on a developer's machine.
      - name: Install Sigstore CLI
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sigstore"
          "$RUNNER_TEMP/sigstore/bin/pip" install \
            --disable-pip-version-check --no-cache-dir \
            "sigstore==4.5.0"
          echo "$RUNNER_TEMP/sigstore/bin" >> "$GITHUB_PATH"

      - name: Verify public distribution without credentials
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: env -u GH_TOKEN -u GITHUB_TOKEN bun run verify:public-distribution
