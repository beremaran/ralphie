name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install ShellCheck 0.10.0
        run: |
          shellcheck_version=0.10.0
          shellcheck_archive="shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/${shellcheck_archive}" \
            --output "$RUNNER_TEMP/$shellcheck_archive"
          printf '%s  %s\n' \
            "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87" \
            "$RUNNER_TEMP/$shellcheck_archive" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$shellcheck_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${shellcheck_version}" >> "$GITHUB_PATH"
      - name: ShellCheck installer
        run: shellcheck --severity=warning scripts/install.sh
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
