name: Sync vendored skills

# Weekly, and on demand, re-sync vendor/mattpocock-skills from upstream and
# open (or update) one pull request when the result differs from the lock.
# See docs/development.md#vendored-skills for the review process.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch, tag or commit (default: the upstream default branch)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: skills-sync
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"
  LOCK: vendor/mattpocock-skills/lock.json

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Sync the vendored copy
        id: sync
        env:
          REF: ${{ inputs.ref }}
        run: |
          previous=$(jq -r .commit "$LOCK")
          locked=$(jq -cS 'del(.commit)' "$LOCK")
          bun run skills:sync ${REF:+"$REF"}
          current=$(jq -r .commit "$LOCK")
          synced=$(jq -cS 'del(.commit)' "$LOCK")
          # A new upstream commit that leaves every vendored file and skill
          # location unchanged only moves the locked commit: no pull request.
          if [ "$locked" = "$synced" ]; then changed=false; else changed=true; fi
          {
            echo "changed=$changed"
            echo "previous=$previous"
            echo "current=$current"
            echo "short=${current:0:7}"
            echo "repository=$(jq -r .repository "$LOCK")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the copy against its lock
        if: steps.sync.outputs.changed == 'true'
        run: bun test tests/skills-sync.test.ts

      - name: Open or update the sync pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: skills-sync
          delete-branch: true
          add-paths: vendor/mattpocock-skills
          commit-message: Sync vendored skills to mattpocock/skills@${{ steps.sync.outputs.short }}
          title: Sync vendored skills to mattpocock/skills@${{ steps.sync.outputs.short }}
          body: |
            `bun run skills:sync` moved the vendored copy of mattpocock/skills from `${{ steps.sync.outputs.previous }}` to `${{ steps.sync.outputs.current }}`.

            Upstream diff: ${{ steps.sync.outputs.repository }}/compare/${{ steps.sync.outputs.previous }}...${{ steps.sync.outputs.current }}

            The vendored files are never edited by hand (ADR-0002). Review the upstream changes in this diff and follow the checklist in `docs/development.md#vendored-skills`: where the new skill text departs from Ralphie's contract, change Ralphie's skill overlays, not the vendored files.

            Pull requests opened by this workflow do not trigger CI on their own; close and reopen this pull request, or run `bun run check` on the branch, before merging.
