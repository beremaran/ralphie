name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: darwin, os: macos-latest, arch: arm64 }
          - { name: darwin, os: macos-latest, arch: x64 }
          - { name: linux, os: ubuntu-latest, arch: arm64 }
          - { name: linux, os: ubuntu-latest, arch: x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Native builds target the host OS/arch, so arm64 and x64 must be built
      # on runners of that architecture where possible.
      - name: Build native binary
        run: bun run build

      - name: Rename asset
        run: mv dist/cli "ralphie-${{ matrix.name }}-${{ matrix.arch }}"

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: "${{ github.event.repo.upload_url }}"
          asset_path: "ralphie-${{ matrix.name }}-${{ matrix.arch }}"
          asset_name: "ralphie-${{ matrix.name }}-${{ matrix.arch }}"
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/beremaran/ralphie
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          platforms: linux/amd64,linux/arm64
