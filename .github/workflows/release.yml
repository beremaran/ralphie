name: Release

on:
  # Run validation for every tag so an unsupported tag fails explicitly rather
  # than being ignored by the workflow trigger.
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (v<major>.<minor>.<patch>)"
        required: true
        type: string
      ref:
        description: "Full 40-character commit SHA targeted by the version tag"
        required: true
        type: string
      dry_run:
        description: "Validate and build artifacts without publishing a release or image"
        required: false
        default: true
        type: boolean

# Jobs must opt into their small, explicit permission set.
permissions: {}

env:
  BUN_VERSION: "1.3.14"

jobs:
  validate:
    name: Validate release context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-context.outputs.version }}
      tag: ${{ steps.release-context.outputs.tag }}
      source_ref: ${{ steps.release-context.outputs.source_ref }}
      dry_run: ${{ steps.release-context.outputs.dry_run }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          # A manual run must never silently check out the workflow's default
          # branch. The validation step below proves this ref is the tag's
          # commit before any later job can run.
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate and resolve release context
        id: release-context
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: bun scripts/validate-release-context.ts

  stage-package:
    name: Stage npm package and installer
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This job only prepares immutable inputs. The script builds with the
      # validated source/version and never publishes to npm or GitHub.
      - name: Build and validate package staging inputs
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: >-
          bun run package:stage --
          --version "$VERSION"
          --commit-sha "$SOURCE_REF"
          --output-dir release-package

      - name: Upload immutable package staging inputs
        uses: actions/upload-artifact@v4
        with:
          name: ralphie-package-${{ needs.validate.outputs.version }}
          path: |
            release-package/beremaran-ralphie-${{ needs.validate.outputs.version }}.tgz
            release-package/scripts/install.sh
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # Let every target report its result, while still making the matrix job
      # fail when any target fails so publish cannot proceed with a partial set.
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-14 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: linux-x64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native target architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            darwin-arm64) expected_os=Darwin; expected_arch=arm64 ;;
            darwin-x64) expected_os=Darwin; expected_arch=x86_64 ;;
            linux-arm64) expected_os=Linux; expected_arch=aarch64 ;;
            linux-x64) expected_os=Linux; expected_arch=x86_64 ;;
            *) echo "Unsupported native target: $TARGET" >&2; exit 1 ;;
          esac
          actual_os="$(uname -s)"
          actual_arch="$(uname -m)"
          if [[ "$actual_os" != "$expected_os" || "$actual_arch" != "$expected_arch" ]]; then
            echo "Runner $actual_os/$actual_arch does not match native target $TARGET" >&2
            exit 1
          fi

      - name: Build native binary
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.validate.outputs.source_ref }}
          TARGET: ${{ matrix.target }}
        run: >-
          bun run build -- --target "$TARGET"
          --commit-sha "$RELEASE_COMMIT_SHA"
          --version "$RELEASE_VERSION"

      - name: Verify native binary format and architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="dist/ralphie-${TARGET}"
          test -s "$binary"
          test -x "$binary"
          bun scripts/verify-native-artifact.ts --target "$TARGET" --path "$binary" >/dev/null
          command -v file >/dev/null
          description="$(file -b "$binary")"

          case "$TARGET" in
            darwin-arm64)
              [[ "$description" == "Mach-O 64-bit executable arm64" ]]
              test "$(lipo -archs "$binary")" = arm64
              test "$(otool -l "$binary" | awk '
                $1 == "cmd" { command = $2 }
                command == "LC_BUILD_VERSION" && $1 == "platform" {
                  print $2
                  exit
                }
              ')" = 1
              ;;
            darwin-x64)
              [[ "$description" == "Mach-O 64-bit executable x86_64" ]]
              test "$(lipo -archs "$binary")" = x86_64
              test "$(otool -l "$binary" | awk '
                $1 == "cmd" { command = $2 }
                command == "LC_BUILD_VERSION" && $1 == "platform" {
                  print $2
                  exit
                }
              ')" = 1
              ;;
            linux-arm64)
              [[ "$description" == ELF* && "$description" == *"ARM aarch64"* ]]
              [[ "$description" == *"GNU/Linux"* ]]
              ;;
            linux-x64)
              [[ "$description" == ELF* && "$description" == *"x86-64"* ]]
              [[ "$description" == *"GNU/Linux"* ]]
              ;;
            *)
              echo "Unsupported native target: $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Verify native binary metadata
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate.outputs.source_ref }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="dist/ralphie-${TARGET}"
          test -s "$binary"
          test -x "$binary"
          version_output="$RUNNER_TEMP/ralphie-version.txt"
          ./$binary --version > "$version_output"
          test -s "$version_output"
          version_json="$(./$binary --version --output json)"
          jq -e \
            --arg version "$EXPECTED_VERSION" \
            --arg commit_sha "$EXPECTED_COMMIT_SHA" \
            'type == "object" and .version == $version and .commitSha == $commit_sha' \
            <<< "$version_json" >/dev/null

      - name: Prepare and checksum release asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="ralphie-${TARGET}"
          checksum_file="${asset}.sha256"
          binary="dist/${asset}"
          mv "$binary" "$asset"
          digest="$(bun scripts/verify-native-artifact.ts --target "$TARGET" --path "$asset" | awk '{print $1}')"
          echo "$asset SHA-256: $digest"
          printf '%s  %s\n' "$digest" "$asset" > "$checksum_file"
          test "$(awk '{print $1}' "$checksum_file")" = "$digest"

      # Artifacts are only staging. The token cannot publish a release asset.
      - name: Stage release asset and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            ralphie-${{ matrix.target }}
            ralphie-${{ matrix.target }}.sha256
          if-no-files-found: error
          # v4 artifacts are immutable; an attempted rerun must fail rather
          # than replace an artifact produced by another run.
          overwrite: false
          # Keep staged inputs through the protected-environment approval
          # window; 90 days is the maximum GitHub Actions artifact lifetime.
          retention-days: 90

  aggregate-release-metadata:
    name: Aggregate release metadata
    needs:
      - validate
      - build-binaries
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.build-binaries.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      # Use one exact artifact name per target. This prevents an untrusted
      # artifact matching a broad pattern from entering the release bundle.
      - name: Download darwin-arm64 staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-darwin-arm64
          path: release-staging/ralphie-${{ needs.validate.outputs.version }}-darwin-arm64
      - name: Download darwin-x64 staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-darwin-x64
          path: release-staging/ralphie-${{ needs.validate.outputs.version }}-darwin-x64
      - name: Download linux-arm64 staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-linux-arm64
          path: release-staging/ralphie-${{ needs.validate.outputs.version }}-linux-arm64
      - name: Download linux-x64 staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-linux-x64
          path: release-staging/ralphie-${{ needs.validate.outputs.version }}-linux-x64

      - name: Verify binaries and create release metadata
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          bun scripts/create-release-metadata.ts \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit-sha "$SOURCE_REF" \
            --artifacts-dir release-staging \
            --output-dir release-bundle

      # This is the only native bundle consumed by the publisher. v4 artifact
      # names are immutable and include the validated package version.
      - name: Stage immutable release metadata bundle
        uses: actions/upload-artifact@v4
        with:
          name: ralphie-release-metadata-${{ needs.validate.outputs.version }}
          path: release-bundle
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  # This job deliberately has no registry credentials or write permissions.
  # Each matrix leg produces one tested, platform-specific candidate. The
  # protected publisher can later download these immutable artifacts and
  # promote the recorded digests without rebuilding from a moving ref.
  stage-container:
    name: Stage container ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
      IMAGE: ralphie:container-candidate-${{ matrix.arch }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # Both exporters consume this one BuildKit result. The Docker archive is
      # loaded for the smoke test; the OCI archive is the promotion input.
      - name: Build non-publishing container candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          build-args: |
            RALPHIE_VERSION=${{ needs.validate.outputs.version }}
            RALPHIE_COMMIT_SHA=${{ needs.validate.outputs.source_ref }}
            BUN_VERSION=${{ env.BUN_VERSION }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_ref }}
          push: false
          outputs: |
            type=docker,dest=/tmp/ralphie-container-${{ matrix.arch }}.docker.tar
            type=oci,dest=ralphie-container-${{ matrix.arch }}.oci.tar

      - name: Smoke-test entrypoint and inspect release metadata
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_REVISION: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          docker load --input "/tmp/ralphie-container-${ARCH}.docker.tar"

          license_label="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
          version_label="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          revision_label="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$license_label" = "MIT"
          test "$version_label" = "$EXPECTED_VERSION"
          test "$revision_label" = "$EXPECTED_REVISION"

          version_json="$(docker run --rm --platform "$PLATFORM" "$IMAGE" --version --output json)"
          jq -e --arg version "$EXPECTED_VERSION" --arg revision "$EXPECTED_REVISION" \
            '.version == $version and .commitSha == $revision' <<< "$version_json"

          runtime_config="$(docker image inspect "$IMAGE" --format '{{json .Config}}')"
          jq -e \
            '(.User == "65532:65532") and
             (.WorkingDir == "/home/nonroot") and
             (.Env | index("HOME=/home/nonroot") != null)' \
            <<< "$runtime_config" > /dev/null

          docker run --rm --platform "$PLATFORM" --entrypoint /bin/bash "$IMAGE" -c '
            set -eu
            test "$(id -u)" = 65532
            test "$(id -g)" = 65532
            test "$HOME" = /home/nonroot
            test "$(pwd)" = /home/nonroot
            command -v bash >/dev/null
            command -v git >/dev/null
            command -v gh >/dev/null
            command -v ssh >/dev/null
            command -v rg >/dev/null
            command -v fdfind >/dev/null
            git --version >/dev/null
            gh --version >/dev/null
            test -s /etc/ssl/certs/ca-certificates.crt
            state_dir="$HOME/.ralphie"
            test ! -e "$state_dir"
            mkdir -p "$state_dir"
            printf "smoke\\n" > "$state_dir/probe"
            test -s "$state_dir/probe"
          '

      # Candidate contract v1 for the final publisher:
      # - artifact: ralphie-container-candidate-<version>-<arch>
      # - archive: the platform-specific OCI archive below
      # - digest: the BuildKit image manifest digest
      # - source_ref/platform/archive_sha256: values the publisher must match
      # before promoting the archive. A failed build, smoke test, or metadata
      # check never reaches this step or the immutable artifact upload.
      - name: Write candidate digest and platform contract
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          archive="ralphie-container-${ARCH}.oci.tar"
          contract="ralphie-container-${ARCH}.metadata.json"
          test -s "$archive"
          digest="$(printf '%s\n' "$BUILD_DIGEST" | grep -E '^sha256:[0-9a-f]{64}$')"
          # Bind the recorded digest to the archive's own OCI index entry
          # before staging: a single-platform export has exactly one manifest
          # descriptor, and its digest must equal the BuildKit digest above,
          # so the promotion input and the persisted contract cannot drift.
          index_digest="$(tar -xOf "$archive" index.json | jq -er '.manifests[0].digest')"
          manifest_count="$(tar -xOf "$archive" index.json | jq -er '.manifests | length')"
          test "$manifest_count" = 1
          test "$index_digest" = "$(printf '%s\n' "$index_digest" | grep -E '^sha256:[0-9a-f]{64}$')"
          test "$index_digest" = "$digest"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f1)"
          artifact="ralphie-container-candidate-${VERSION}-${ARCH}"
          image_license="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
          image_version="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          jq -n \
            --arg schema "ralphie.container-candidate.v1" \
            --arg artifact "$artifact" \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            --arg platform "$PLATFORM" \
            --arg digest "$digest" \
            --arg format "oci-archive" \
            --arg archive "$archive" \
            --arg archive_sha256 "$archive_sha256" \
            --arg image_license "$image_license" \
            --arg image_version "$image_version" \
            --arg image_revision "$image_revision" \
            '{
              schema: $schema,
              artifact: $artifact,
              version: $version,
              source_ref: $source_ref,
              platform: $platform,
              digest: $digest,
              format: $format,
              archive: $archive,
              archive_sha256: $archive_sha256,
              image_license: $image_license,
              image_version: $image_version,
              image_revision: $image_revision
            }' \
            > "$contract"

      # v4 artifact names are immutable. The final publisher downloads the two
      # names from the contract above, verifies each archive_sha256 and digest,
      # and publishes only the matching linux/amd64 and linux/arm64 pair.
      - name: Upload tested container candidate
        uses: actions/upload-artifact@v4
        with:
          name: ralphie-container-candidate-${{ needs.validate.outputs.version }}-${{ matrix.arch }}
          path: ralphie-container-${{ matrix.arch }}.*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish-npm:
    name: Publish npm package
    needs:
      - validate
      - stage-package
      - aggregate-release-metadata
    if: needs.validate.outputs.dry_run == 'false' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs['stage-package'].result == 'success' && needs.aggregate-release-metadata.result == 'success'
    # The validation job also rejects unqualified manual dispatches. Keep the
    # ref guard here so this publisher can never run from a branch, even if a
    # future change weakens another job's condition.
    runs-on: ubuntu-latest
    # One-time npm setup: in the package's npmjs.com settings, add the GitHub
    # Actions trusted publisher for owner beremaran, repository ralphie,
    # workflow release.yml, and environment release. This job intentionally
    # uses only GitHub's short-lived OIDC exchange and no registry secret.
    environment:
      name: release
      url: https://www.npmjs.com/package/@beremaran/ralphie
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - name: Download validated package staging inputs
        uses: actions/download-artifact@v4
        with:
          name: ralphie-package-${{ needs.validate.outputs.version }}
          path: package-staging
          merge-multiple: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      - name: Verify scoped package and release tag version
        id: npm-context
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: bun scripts/validate-npm-context.ts

      # npm trusted publishing requires a recent npm CLI and Node runtime.
      # Do not configure setup-node with a registry or auth file: npm obtains
      # publish authorization from the GitHub OIDC token instead of a long-lived token.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install npm trusted-publishing client
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1 --no-audit --no-fund
          test "$(npm --version)" = 11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and smoke-test packed package
        run: bun run package:check

      - name: Publish scoped package with npm provenance
        run: npm publish --provenance --access public "package-staging/beremaran-ralphie-${{ needs.validate.outputs.version }}.tgz"

      - name: Verify exact package from npm registry
        env:
          VERSION: ${{ steps.npm-context.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_SPEC="@beremaran/ralphie@$VERSION"
          METADATA_FILE="$RUNNER_TEMP/ralphie-npm-metadata.json"
          METADATA_ERROR="$RUNNER_TEMP/ralphie-npm-metadata.error"
          MAX_ATTEMPTS=6

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1)); do
            smoke_status=0
            bun run package:check -- --registry --package-spec "$PACKAGE_SPEC" || smoke_status=$?

            if (( smoke_status == 0 )); then
              if ! npm view "$PACKAGE_SPEC" name version --json > "$METADATA_FILE" 2> "$METADATA_ERROR"; then
                if ! grep -Eq 'E404|404 Not Found' "$METADATA_FILE" "$METADATA_ERROR"; then
                  echo "npm registry lookup failed for $PACKAGE_SPEC; not treating it as propagation" >&2
                  cat "$METADATA_ERROR" >&2 || true
                  exit 1
                fi
                if (( attempt == MAX_ATTEMPTS )); then
                  echo "npm registry metadata did not propagate for $PACKAGE_SPEC" >&2
                  cat "$METADATA_ERROR" >&2 || true
                  exit 1
                fi
                echo "npm registry metadata is still propagating; retrying registry smoke (attempt $((attempt + 1))/$MAX_ATTEMPTS)" >&2
                sleep 10
                continue
              fi
              if ! jq -e --arg name @beremaran/ralphie --arg version "$VERSION" \
                '.name == $name and .version == $version' "$METADATA_FILE" > /dev/null; then
                echo "npm registry returned unexpected metadata for $PACKAGE_SPEC" >&2
                cat "$METADATA_FILE" >&2
                exit 1
              fi
              exit 0
            fi

            # A failed exact lookup is the only retryable condition: npm's
            # package metadata/tarball may still be propagating. Once exact
            # metadata exists, a smoke failure is a package defect and must
            # fail the release rather than retrying or accepting another name.
            if npm view "$PACKAGE_SPEC" name version --json > "$METADATA_FILE" 2> "$METADATA_ERROR"; then
              if ! jq -e --arg name @beremaran/ralphie --arg version "$VERSION" \
                '.name == $name and .version == $version' "$METADATA_FILE" > /dev/null; then
                echo "npm registry returned unexpected metadata for $PACKAGE_SPEC" >&2
                cat "$METADATA_FILE" >&2
                exit 1
              fi
              echo "Registry metadata exists for $PACKAGE_SPEC, but the package smoke check failed; refusing to retry" >&2
              exit "$smoke_status"
            fi
            if ! grep -Eq 'E404|404 Not Found' "$METADATA_FILE" "$METADATA_ERROR"; then
              echo "npm registry lookup failed for $PACKAGE_SPEC; not treating it as propagation" >&2
              cat "$METADATA_ERROR" >&2 || true
              exit "$smoke_status"
            fi

            if (( attempt == MAX_ATTEMPTS )); then
              echo "npm registry package $PACKAGE_SPEC did not propagate after $MAX_ATTEMPTS attempts" >&2
              cat "$METADATA_ERROR" >&2 || true
              exit "$smoke_status"
            fi
            echo "npm registry package $PACKAGE_SPEC is still propagating; retrying registry smoke (attempt $((attempt + 1))/$MAX_ATTEMPTS)" >&2
            sleep 10
          done

  publish:
    name: Publish release
    needs:
      - validate
      - build-binaries
      - stage-container
      - aggregate-release-metadata
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.build-binaries.result == 'success' &&
        needs.stage-container.result == 'success' &&
        needs.aggregate-release-metadata.result == 'success' &&
        needs.validate.outputs.dry_run == 'false' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    # Configure this environment in repository settings with required
    # reviewers. Its protection gate is the only approval before publication.
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    permissions:
      contents: write
      # `actions: read` lets the publisher inventory this run's workflow
      # artifacts through the REST API before downloading the exact
      # candidate names; it grants no write capability.
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      # Checkout must precede artifact download: checkout's clean step would
      # otherwise remove the untracked final release-assets directory.
      - name: Download verified release metadata bundle
        uses: actions/download-artifact@v4
        with:
          name: ralphie-release-metadata-${{ needs.validate.outputs.version }}
          path: release-assets
          merge-multiple: false

      - name: Verify release metadata and exact assets
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          jq -e \
            --arg schema "ralphie.release-metadata.v1" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg commit "$SOURCE_REF" \
            '(.schema == $schema) and
             (.tag == $tag) and
             (.version == $version) and
             (.commit == $commit) and
             (.commit | test("^[0-9a-f]{40}$")) and
             (.assets | (type == "array" and length == 4 and
              ((map(select((.name | type) == "string" and (.sha256 | type) == "string"))) | length == 4))) and
             ([.assets[].name] | sort) == ["ralphie-darwin-arm64", "ralphie-darwin-x64", "ralphie-linux-arm64", "ralphie-linux-x64"] and
             ([.assets[].sha256] | all(test("^[0-9a-f]{64}$")))' \
            release-assets/release-metadata.json > /dev/null
          jq -r '.assets[] | "\(.sha256)  \(.name)"' \
            release-assets/release-metadata.json > "$RUNNER_TEMP/release-metadata-sums"
          cmp --silent "$RUNNER_TEMP/release-metadata-sums" release-assets/SHA256SUMS
          for asset in \
            ralphie-darwin-arm64 \
            ralphie-darwin-x64 \
            ralphie-linux-arm64 \
            ralphie-linux-x64; do
            test -s "release-assets/$asset"
          done
          (cd release-assets && sha256sum --check SHA256SUMS)

      # Recompute the canonical manifest from the final bytes in the
      # immutable metadata bundle. The aggregation manifest must match this
      # fresh computation before anything can be published.
      - name: Collect binaries and create SHA256SUMS
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          manifest="$RUNNER_TEMP/SHA256SUMS"
          : > "$manifest"
          for asset in \
            ralphie-darwin-arm64 \
            ralphie-darwin-x64 \
            ralphie-linux-arm64 \
            ralphie-linux-x64; do
            test -s "release-assets/$asset"
            digest="$(sha256sum "release-assets/$asset" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$asset" >> "$manifest"
          done
          cmp --silent "$manifest" release-assets/SHA256SUMS
          test "$(wc -l < "$manifest" | tr -d '[:space:]')" = 4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      - name: Install dependencies for SBOM validation
        run: bun install --frozen-lockfile

      # Generate only after the aggregation job has copied and renamed the
      # binaries into their final release-assets names. The wrapper verifies
      # those bytes, the exact release metadata, and the validated checkout.
      - name: Generate and validate deterministic SPDX SBOMs
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          bun_version="$(bun --version)"
          test "$bun_version" = "$BUN_VERSION"
          bun scripts/create-sboms.ts \
            --assets-dir release-assets \
            --output-dir release-assets \
            --source-dir . \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit-sha "$SOURCE_REF" \
            --bun-version "$bun_version" \
            --build-tool-version "$bun_version" \
            --build-command "bun run build -- --commit-sha $SOURCE_REF --version $VERSION"

      # Keep non-secret digest evidence for the exact final paths below. The
      # preceding metadata gate and this fresh hash both cover final bytes.
      - name: Record final attestation subject digests
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$SOURCE_REF"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          bun_version="$(bun --version)"
          test "$bun_version" = "$BUN_VERSION"
          subjects='[]'
          for asset in ralphie-darwin-arm64 ralphie-darwin-x64 ralphie-linux-arm64 ralphie-linux-x64; do
            path="release-assets/$asset"
            test -s "$path"
            digest="$(sha256sum "$path" | awk '{print $1}')"
            expected="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .sha256' release-assets/release-metadata.json)"
            test "$digest" = "$expected"
            subjects="$(jq --arg path "$path" --arg name "$asset" --arg digest "$digest" '. + [{path: $path, name: $name, algorithm: "sha256", digest: $digest}]' <<< "$subjects")"
          done
          jq -n \
            --arg schema "ralphie.release-attestation-subjects.v1" \
            --arg tag "$TAG" --arg version "$VERSION" --arg commit "$SOURCE_REF" \
            --arg workflow "Release" --arg workflow_file ".github/workflows/release.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg bun_version "$bun_version" \
            --arg build_command "bun run build -- --commit-sha $SOURCE_REF --version $VERSION" \
            --argjson subjects "$subjects" \
            '{schema: $schema, tag: $tag, version: $version, commit: $commit,
              workflow: $workflow, workflow_file: $workflow_file, workflow_ref: $workflow_ref,
              build: {bun_version: $bun_version, build_tool: "Bun", build_tool_version: $bun_version, build_command: $build_command},
              subjects: $subjects}' > release-assets/attestation-subjects.json

      # Attest each final renamed binary independently. A missing subject makes
      # the action fail, and the immutable pin prevents action ref drift.
      - name: Attest darwin-arm64 final binary
        id: attest_darwin_arm64
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: release-assets/ralphie-darwin-arm64
          show-summary: true
      - name: Attest darwin-x64 final binary
        id: attest_darwin_x64
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: release-assets/ralphie-darwin-x64
          show-summary: true
      - name: Attest linux-arm64 final binary
        id: attest_linux_arm64
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: release-assets/ralphie-linux-arm64
          show-summary: true
      - name: Attest linux-x64 final binary
        id: attest_linux_x64
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: release-assets/ralphie-linux-x64
          show-summary: true

      - name: Verify all binary attestations exist
        env:
          ATTESTATION_IDS: ${{ steps.attest_darwin_arm64.outputs.attestation-id }} ${{ steps.attest_darwin_x64.outputs.attestation-id }} ${{ steps.attest_linux_arm64.outputs.attestation-id }} ${{ steps.attest_linux_x64.outputs.attestation-id }}
        run: |
          set -euo pipefail
          read -r -a attestation_ids <<< "$ATTESTATION_IDS"
          test "${#attestation_ids[@]}" = 4
          for attestation_id in "${attestation_ids[@]}"; do test -n "$attestation_id"; done
          test "$(printf '%s\n' "${attestation_ids[@]}" | wc -l)" = 4
          test "$(printf '%s\n' "${attestation_ids[@]}" | sort -u | wc -l)" = 4

      # Verify the generated documents and the attestations against the exact
      # files that the release uploader will consume. The API response is
      # checked (at least one record, every record with a bundle) as well as
      # the cryptographic gh verification: a valid attestation for an old
      # filename, source checkout, or another run is not sufficient. The
      # record count is presence-based because attestation records are keyed
      # by bundle signature and a rerun of an interrupted attempt leaves
      # extra records for the same digest; at least one record must carry the
      # identity of this exact run. This gate must remain before the release
      # handle is created.
      - name: Verify final SBOMs and build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$SOURCE_REF"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          expected_binaries=$'ralphie-darwin-arm64\nralphie-darwin-x64\nralphie-linux-arm64\nralphie-linux-x64'
          actual_binaries="$(find release-assets -maxdepth 1 -type f -name 'ralphie-*' ! -name '*.sha256' ! -name '*.sbom.spdx.json' -printf '%f\n' | sort)"
          test "$actual_binaries" = "$expected_binaries"
          expected_sboms=$'ralphie-darwin-arm64.sbom.spdx.json\nralphie-darwin-x64.sbom.spdx.json\nralphie-linux-arm64.sbom.spdx.json\nralphie-linux-x64.sbom.spdx.json'
          actual_sboms="$(find release-assets -maxdepth 1 -type f -name '*.sbom.spdx.json' -printf '%f\n' | sort)"
          test "$actual_sboms" = "$expected_sboms"

          attestation_response="$RUNNER_TEMP/ralphie-attestations.json"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            binary="release-assets/ralphie-$target"
            sbom="$binary.sbom.spdx.json"
            test "$(find release-assets -maxdepth 1 -type f -name "ralphie-$target" | wc -l | tr -d '[:space:]')" = 1
            test "$(find release-assets -maxdepth 1 -type f -name "ralphie-$target.sbom.spdx.json" | wc -l | tr -d '[:space:]')" = 1
            test -s "$binary"
            test -s "$sbom"

            digest="$(sha256sum "$binary" | awk '{print $1}')"
            size="$(wc -c < "$binary" | tr -d '[:space:]')"
            jq -e \
              --arg tag "$TAG" \
              --arg version "$VERSION" \
              --arg commit "$SOURCE_REF" \
              --arg target "$target" \
              --arg binary "ralphie-$target" \
              --arg digest "$digest" \
              --arg size "$size" \
              ' . as $document |
               ($document.creationInfo.comment | fromjson) as $metadata |
               ($document.spdxVersion == "SPDX-2.3") and
               ($document.name == ("ralphie-" + $version + "-" + $target)) and
               ($metadata.releaseTag == $tag) and
               ($metadata.releaseVersion == $version) and
               ($metadata.commitSha == $commit) and
               ($metadata.target == $target) and
               ($metadata.finalBinaryFilename == $binary) and
               ($metadata.finalBinarySha256 == $digest) and
               ($metadata.finalBinarySize == ($size | tonumber)) and
               ([ $document.files[]? | select(.fileName == $binary) ] | length == 1) and
               ([ $document.files[]? | select(.fileName == $binary) | .checksums[]? |
                  select(.algorithm == "SHA256") | .checksumValue ] == [$digest])' \
              "$sbom" > /dev/null

            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GH_REPO/attestations/sha256:$digest?per_page=100" > "$attestation_response"
            # Presence-based: a rerun of an interrupted attempt leaves extra
            # bundle records for the same digest under new signatures, so
            # require at least one record and a non-null bundle on every
            # record; the binding to this exact run follows below.
            jq -e \
              '([.[].attestations[]] | length >= 1) and
               (all([.[].attestations[]][]; .bundle != null))' \
              "$attestation_response" > /dev/null

            verification="$(
              gh attestation verify "$binary" \
                --repo "$GH_REPO" \
                --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
                --source-ref "refs/tags/$TAG" \
                --cert-identity "https://github.com/$GH_REPO/.github/workflows/release.yml@refs/tags/$TAG" \
                --cert-oidc-issuer https://token.actions.githubusercontent.com \
                --predicate-type https://slsa.dev/provenance/v1 \
                --format json
            )"
            jq -e \
              --arg digest "$digest" \
              --arg binary "ralphie-$target" \
              --arg repo "$GH_REPO" \
              --arg tag "$TAG" \
              --arg commit "$SOURCE_REF" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              'any(.[];
               . as $attestation |
               ($attestation.verificationResult.statement) as $statement |
               ($statement.predicate) as $predicate |
               ($statement.predicateType == "https://slsa.dev/provenance/v1") and
               ([ $statement.subject[]? ] | length == 1) and
               ($statement.subject[0].name == $binary) and
               ($statement.subject[0].digest.sha256 == $digest) and
               ($predicate.buildDefinition.externalParameters.workflow.repository == ("https://github.com/" + $repo)) and
               ($predicate.buildDefinition.externalParameters.workflow.path == ".github/workflows/release.yml") and
               ($predicate.buildDefinition.externalParameters.workflow.ref == ("refs/tags/" + $tag)) and
               ($predicate.buildDefinition.internalParameters.github.event_name == $event) and
               ([ $predicate.buildDefinition.resolvedDependencies[]? |
                  select(.uri == ("git+https://github.com/" + $repo + "@refs/tags/" + $tag) and
                         .digest.gitCommit == $commit) ] | length == 1) and
               ($predicate.runDetails.metadata.invocationId == ("https://github.com/" + $repo + "/actions/runs/" + $run_id + "/attempts/" + $run_attempt)))' \
              <<< "$verification"
          done

      # Sign the exact manifest that will be published. Ambient GitHub OIDC
      # credentials stay inside the Sigstore action and are never written to
      # the checkout, build context, logs, or release assets.
      - name: Sign and verify SHA256SUMS with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: release-assets/SHA256SUMS
          verify: true
          verify-cert-identity: "https://github.com/beremaran/ralphie/.github/workflows/release.yml@refs/tags/${{ needs.validate.outputs.tag }}"
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false

      # Create the draft release handle only after final collection, SBOM,
      # attestation, and signing have succeeded. Any later upload failure still
      # leaves this validated handle as a recoverable draft.
      - name: Create or reuse draft release handle
        id: release-handle
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = process.env.RELEASE_TAG;
            const sourceRef = process.env.SOURCE_REF;
            const { owner, repo } = context.repo;
            if (!tag || !sourceRef) throw new Error("Validated release tag and source ref are required");

            const getRelease = async () => {
              try {
                return (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              } catch (error) {
                if (error.status === 404) return undefined;
                throw error;
              }
            };
            let release = await getRelease();
            if (!release) {
              try {
                release = (await github.rest.repos.createRelease({
                  owner, repo, tag_name: tag, target_commitish: sourceRef,
                  name: tag, generate_notes: true, draft: true,
                })).data;
              } catch (error) {
                if (error.status !== 422) throw error;
                release = await getRelease();
                if (!release) throw new Error("Release creation conflicted but no release could be found");
              }
            }
            if (release.tag_name !== tag) throw new Error(`Release tag mismatch: expected ${tag}, got ${release.tag_name}`);
            if (release.target_commitish !== sourceRef) throw new Error(`Release target mismatch: expected ${sourceRef}, got ${release.target_commitish}`);
            if (typeof release.draft !== "boolean") throw new Error("Release draft state is missing or invalid");
            if (release.draft && release.published_at !== null) throw new Error("A draft release must not have a published timestamp");
            if (!release.draft && typeof release.published_at !== "string") throw new Error("A published release must have a published timestamp");
            if (!Number.isSafeInteger(release.id) || release.id <= 0) throw new Error(`Release id is invalid: ${release.id}`);
            const uploadUrlPattern = /^https:\/\/uploads\.github\.com\/repos\/[^/]+\/[^/]+\/releases\/([1-9][0-9]*)\/assets\{\?name,label\}$/;
            if (typeof release.upload_url !== "string") throw new Error("Release upload_url is missing or invalid");
            const uploadUrlMatch = release.upload_url.match(uploadUrlPattern);
            if (uploadUrlMatch === null || Number(uploadUrlMatch[1]) !== release.id) throw new Error("Release upload_url is missing or invalid");
            const state = release.draft ? "draft" : "published";
            core.setOutput("release_id", String(release.id));
            core.setOutput("upload_url", release.upload_url);
            core.setOutput("state", state);

      # ------------------------------------------------------------------
      # Container publication (rel20-publisher-container-promotion-integration).
      #
      # The uncredentialed `stage-container` matrix staged exactly two
      # immutable amd64/arm64 candidates. This protected publisher inventories
      # the workflow artifacts, downloads those exact names, then runs the
      # candidate validator and every local OCI-manifest check BEFORE the
      # GHCR login step; a failure stops the job and nothing is rebuilt. Only
      # after validation and tag planning succeed does the job authenticate
      # and promote the exact tested platform manifests to the
      # normalized-version platform tags through the create-only registry
      # reconciler (every destination is preflighted first, exact existing
      # digests are reused, missing tags are created only through the probed
      # server-enforced compare-and-swap, and tags are never moved). The
      # attestation steps run between platform promotion and the
      # release-index aliases, and every alias from the tag plan is then
      # reconciled from the exact assembled index digest, so any
      # authentication or push failure fails the job and prevents later
      # alias publication. Prereleases never receive `latest`, and build
      # metadata never reaches a registry ref (the tag plan normalizes it
      # out of every OCI-safe tag).
      - name: Inventory exact staged container candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # The exact artifact names are immutable per release version. For
          # each validated platform, require at least one non-expired
          # artifact with that exact name uploaded by this workflow run; a
          # missing, expired, foreign, or stale artifact fails here, before
          # any download, validation, or registry login.
          for arch in amd64 arm64; do
            name="ralphie-container-candidate-${VERSION}-${arch}"
            inventory="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GH_REPO/actions/artifacts?name=$name&per_page=100")"
            jq -e \
              --arg name "$name" \
              --arg run_id "$GITHUB_RUN_ID" \
              '(.artifacts | type == "array" and length >= 1) and
               (all(.artifacts[];
                    (.name == $name) and
                    (.expired == false) and
                    (.workflow_run | type == "object") and
                    (.workflow_run.id == ($run_id | tonumber))))' \
              <<< "$inventory" > /dev/null
          done
      - name: Download amd64 container candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-container-candidate-${{ needs.validate.outputs.version }}-amd64
          path: container-candidates/ralphie-container-candidate-${{ needs.validate.outputs.version }}-amd64
      - name: Download arm64 container candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-container-candidate-${{ needs.validate.outputs.version }}-arm64
          path: container-candidates/ralphie-container-candidate-${{ needs.validate.outputs.version }}-arm64
      - name: Validate exact staged container candidate set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          bun scripts/validate-container-candidates.ts \
            --candidates-dir container-candidates \
            --version "$VERSION" \
            --source-ref "$SOURCE_REF"
      - name: Install skopeo
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes skopeo
          fi
      - name: Inspect OCI metadata before promotion
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="container-candidates/ralphie-container-candidate-${VERSION}-${arch}/ralphie-container-${arch}.oci.tar"
            contract="container-candidates/ralphie-container-candidate-${VERSION}-${arch}/ralphie-container-${arch}.metadata.json"
            expected_digest="$(jq -er '.digest' "$contract")"
            actual_digest="$(skopeo inspect --format '{{.Digest}}' "oci-archive:$archive")"
            license_label="$(skopeo inspect --format '{{ index .Labels "org.opencontainers.image.licenses" }}' "oci-archive:$archive")"
            version_label="$(skopeo inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "oci-archive:$archive")"
            revision_label="$(skopeo inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "oci-archive:$archive")"
            test "$actual_digest" = "$expected_digest"
            test "$license_label" = "MIT"
            test "$version_label" = "$VERSION"
            test "$revision_label" = "$SOURCE_REF"
          done
      - name: Derive container tag plan
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          bun scripts/derive-container-tags.ts \
            --version "$VERSION" \
            --source-ref "$SOURCE_REF" \
            --output container-tag-plan.json
          jq -e \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            '(.schema == "ralphie.container-tag-plan.v1") and
             (.version == $version) and
             (.source_ref == $source_ref) and
             (.version_tag | contains("+") | not) and
             (.platform_tag_base == .version_tag) and
             (.source_tag == ("sha-" + $source_ref)) and
             (.index_tags | length) == (.index_tags | unique | length) and
             (.index_tags | length) >= 3 and
             (.index_tags[0] == .version_tag) and
             (.index_tags[1] == .minor_tag) and
             (.index_tags[-1] == .source_tag) and
             (if .latest then
                (.index_tags[2] == "latest") and (.index_tags | length) == 4
              else
                (.index_tags | index("latest")) == null and
                (.index_tags | length) == 3
              end) and
             ([.index_tags[] | select(contains("+"))] | length == 0) and
             ([.platform_tags[] | select(contains("+"))] | length == 0)' \
            container-tag-plan.json > /dev/null
      - name: Assemble deterministic container index and reconcile plan
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          bun scripts/assemble-container-index.ts \
            --candidates-dir container-candidates \
            --version "$VERSION" \
            --source-ref "$SOURCE_REF" \
            --image ghcr.io/beremaran/ralphie \
            --tag-plan container-tag-plan.json \
            --output container-index
          jq -e \
            --arg schema "ralphie.container-reconcile-plan.v1" \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            --arg image "ghcr.io/beremaran/ralphie" \
            '(.schema == $schema) and
             (.version == $version) and
             (.source_ref == $source_ref) and
             (.image == $image) and
             ([.platform_tags[] | select(contains("+"))] | length == 0) and
             ([.index_tags[] | select(contains("+"))] | length == 0) and
             (.index.digest | test("^sha256:[0-9a-f]{64}$")) and
             ([.platform.amd64.digest, .platform.arm64.digest] |
              (map(test("^sha256:[0-9a-f]{64}$")) | all) and
              (unique | length) == 2)' \
            container-index/ralphie-reconcile-plan.json > /dev/null
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote platform images with create-only reconciliation
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/reconcile-container-registry.ts \
            --plan container-index/ralphie-reconcile-plan.json \
            --stage platform
          jq -e \
            --arg schema "ralphie.publication-subjects.v1" \
            --arg image "ghcr.io/beremaran/ralphie" \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            '(.schema == $schema) and
             (.image == $image) and
             (.version == $version) and
             (.source_ref == $source_ref) and
             (.subjects | type == "array" and length == 2) and
             ([.subjects[].platform] | sort) == ["linux/amd64", "linux/arm64"] and
             ([.subjects[].platform] | unique | length == 2) and
             ([.subjects[].digest] | unique | length == 2) and
             (all(.subjects[]; (.platform == "linux/amd64" or .platform == "linux/arm64") and
                               (.digest | test("^sha256:[0-9a-f]{64}$")) and
                               (.reference == ($image + "@" + .digest))))' \
            publication-subjects.json > /dev/null
      - name: Upload verified publication subjects
        uses: actions/upload-artifact@v4
        with:
          name: ralphie-publication-subjects-${{ needs.validate.outputs.version }}
          path: publication-subjects.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Validate workflow identity and persist container attestation subjects
        id: attestation-subjects
        env:
          IMAGE: ghcr.io/beremaran/ralphie
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          # The signing identity must be the protected release tag and its
          # exact commit, never the default branch or a mutable tag.
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$SOURCE_REF"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          # Re-validate the persisted two-entry subject map exactly as the
          # alias step does: only the linux/amd64 and linux/arm64
          # promotions, unique immutable digests, and references derived as
          # `<image>@<digest>`.
          jq -e \
            --arg schema "ralphie.publication-subjects.v1" \
            --arg image "$IMAGE" \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            '(.schema == $schema) and
             (.image == $image) and
             (.version == $version) and
             (.source_ref == $source_ref) and
             (.subjects | type == "array" and length == 2) and
             ([.subjects[].platform] | sort) == ["linux/amd64", "linux/arm64"] and
             ([.subjects[].platform] | unique | length == 2) and
             ([.subjects[].digest] | unique | length == 2) and
             (all(.subjects[]; (.platform == "linux/amd64" or .platform == "linux/arm64") and
                               (.digest | test("^sha256:[0-9a-f]{64}$")) and
                               (.reference == ($image + "@" + .digest))))' \
            publication-subjects.json > /dev/null

          # Derive one immutable attestation subject per platform: canonical
          # subject-name (the image), exact registry digest and reference,
          # and the deterministic SBOM output name.
          subjects="$(jq -c --arg image "$IMAGE" \
            '[.subjects[] | {
               platform,
               digest,
               reference,
               name: $image,
               sbom: ("ralphie-container-" + (.platform | split("/")[1]) + ".sbom.spdx.json")
             }]' publication-subjects.json)"
          jq -n \
            --arg schema "ralphie.container-attestation-subjects.v1" \
            --arg image "$IMAGE" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            --arg workflow "Release" \
            --arg workflow_file ".github/workflows/release.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson subjects "$subjects" \
            '{schema: $schema, image: $image, tag: $tag, version: $version,
              source_ref: $source_ref, workflow: $workflow,
              workflow_file: $workflow_file, workflow_ref: $workflow_ref,
              run_id: $run_id, run_attempt: $run_attempt, subjects: $subjects}' \
            > container-attestation-subjects.json
          jq -e \
            --arg schema "ralphie.container-attestation-subjects.v1" \
            --arg image "$IMAGE" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            '(.schema == $schema) and
             (.image == $image) and
             (.tag == $tag) and
             (.version == $version) and
             (.source_ref == $source_ref) and
             (.workflow_file == ".github/workflows/release.yml") and
             (.subjects | type == "array" and length == 2) and
             ([.subjects[].platform] | sort) == ["linux/amd64", "linux/arm64"] and
             ([.subjects[].platform] | unique | length == 2) and
             ([.subjects[].digest] | unique | length == 2) and
             (all(.subjects[];
                  (.platform == "linux/amd64" or .platform == "linux/arm64") and
                  (.name == $image) and
                  (.digest | test("^sha256:[0-9a-f]{64}$")) and
                  (.reference == ($image + "@" + .digest)) and
                  (.sbom == ("ralphie-container-" + (.platform | split("/")[1]) + ".sbom.spdx.json"))))' \
            container-attestation-subjects.json > /dev/null

          amd64_digest="$(jq -er '.subjects[] | select(.platform == "linux/amd64") | .digest' container-attestation-subjects.json)"
          arm64_digest="$(jq -er '.subjects[] | select(.platform == "linux/arm64") | .digest' container-attestation-subjects.json)"
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM for linux/amd64 digest
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: ghcr.io/beremaran/ralphie@${{ steps.attestation-subjects.outputs.amd64_digest }}
          format: spdx-json
          output-file: ralphie-container-amd64.sbom.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SPDX SBOM for linux/arm64 digest
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: ghcr.io/beremaran/ralphie@${{ steps.attestation-subjects.outputs.arm64_digest }}
          format: spdx-json
          output-file: ralphie-container-arm64.sbom.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies for container SBOM validation
        run: bun install --frozen-lockfile
      - name: Validate and pin container SBOMs to release identity
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          bun_version="$(bun --version)"
          test "$bun_version" = "$BUN_VERSION"
          bun scripts/validate-container-sboms.ts \
            --subjects container-attestation-subjects.json \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit-sha "$SOURCE_REF"
      - name: Attest linux/amd64 container SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/beremaran/ralphie
          subject-digest: ${{ steps.attestation-subjects.outputs.amd64_digest }}
          sbom-path: ralphie-container-amd64.sbom.spdx.json
          push-to-registry: true
          show-summary: true
      - name: Attest linux/arm64 container SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/beremaran/ralphie
          subject-digest: ${{ steps.attestation-subjects.outputs.arm64_digest }}
          sbom-path: ralphie-container-arm64.sbom.spdx.json
          push-to-registry: true
          show-summary: true
      - name: Attest linux/amd64 container provenance
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-name: ghcr.io/beremaran/ralphie
          subject-digest: ${{ steps.attestation-subjects.outputs.amd64_digest }}
          push-to-registry: true
          show-summary: true
      - name: Attest linux/arm64 container provenance
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-name: ghcr.io/beremaran/ralphie
          subject-digest: ${{ steps.attestation-subjects.outputs.arm64_digest }}
          push-to-registry: true
          show-summary: true
      - name: Verify all container attestations exist and match subjects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$SOURCE_REF"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          jq -e \
            --arg schema "ralphie.container-attestation-subjects.v1" \
            --arg image "ghcr.io/beremaran/ralphie" \
            '(.schema == $schema) and
             (.image == $image) and
             (.subjects | type == "array" and length == 2) and
             ([.subjects[].platform] | sort) == ["linux/amd64", "linux/arm64"] and
             ([.subjects[].platform] | unique | length == 2) and
             ([.subjects[].digest] | unique | length == 2) and
             (all(.subjects[];
                  (.platform == "linux/amd64" or .platform == "linux/arm64") and
                  (.name == $image) and
                  (.digest | test("^sha256:[0-9a-f]{64}$")) and
                  (.reference == ($image + "@" + .digest)) and
                  (.sbom | type == "string") and
                  (.sbom_sha256 | test("^[0-9a-f]{64}$"))))' \
            container-attestation-subjects.json > /dev/null

          # `gh attestation verify` treats any argument without the `oci://`
          # prefix as a local file path, and OCI image verification resolves
          # the digest by fetching the manifest through the Docker keychain.
          # The job token is therefore materialized as an explicit
          # $DOCKER_CONFIG entry for ghcr.io instead of relying on the login
          # action's configuration file, and fetching the manifest for the
          # exact immutable digest re-confirms that the promoted digest
          # still exists under the package before any alias is created.
          docker_config="$RUNNER_TEMP/ralphie-docker-config"
          mkdir -p "$docker_config"
          registry_auth="$(printf '%s:%s' "$GITHUB_ACTOR" "$GH_TOKEN" | base64 -w0)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$registry_auth" > "$docker_config/config.json"
          export DOCKER_CONFIG="$docker_config"

          while IFS= read -r subject; do
            platform="$(jq -er '.platform' <<< "$subject")"
            name="$(jq -er '.name' <<< "$subject")"
            digest="$(jq -er '.digest' <<< "$subject")"
            reference="$(jq -er '.reference' <<< "$subject")"
            sbom="$(jq -er '.sbom' <<< "$subject")"
            sbom_sha256="$(jq -er '.sbom_sha256' <<< "$subject")"

            # The annotated SBOM on disk must still be the exact bytes the
            # validator recorded in the subjects map and that attest-sbom
            # attached; the attested predicate is compared byte-for-byte
            # (parsed) below.
            test "$(sha256sum "$sbom" | cut -d ' ' -f1)" = "$sbom_sha256"

            provenance_document="$(gh attestation verify "oci://$reference" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" \
              --cert-identity "https://github.com/$GH_REPO/.github/workflows/release.yml@refs/tags/$TAG" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json)"
            # The gate is presence-based: re-running an interrupted attempt
            # leaves extra bundle records for the same digest under new
            # signatures, so every element is checked and at least one must
            # carry the identity of this exact run (including the
            # invocationId), the protected tag, and the validated commit.
            # The statement subject digest is the lowercase `sha256:<64 hex>`
            # value, exactly as persisted in the subject map (`gh` reports
            # the algorithm separately on OCI references in terminal output
            # only).
            jq -e \
              --arg name "$name" \
              --arg digest "$digest" \
              --arg repo "$GH_REPO" \
              --arg tag "$TAG" \
              --arg commit "$SOURCE_REF" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              'any(.[];
               . as $attestation |
               ($attestation.verificationResult.statement) as $statement |
               ($statement.predicate) as $predicate |
               ($statement.predicateType == "https://slsa.dev/provenance/v1") and
               ([ $statement.subject[]? ] | length == 1) and
               ($statement.subject[0].name == $name) and
               ("sha256:" + $statement.subject[0].digest.sha256 == $digest) and
               ($predicate.buildDefinition.externalParameters.workflow.repository == ("https://github.com/" + $repo)) and
               ($predicate.buildDefinition.externalParameters.workflow.path == ".github/workflows/release.yml") and
               ($predicate.buildDefinition.externalParameters.workflow.ref == ("refs/tags/" + $tag)) and
               ($predicate.buildDefinition.internalParameters.github.event_name == $event) and
               ([ $predicate.buildDefinition.resolvedDependencies[]? |
                  select(.uri == ("git+https://github.com/" + $repo + "@refs/tags/" + $tag) and
                         .digest.gitCommit == $commit) ] | length == 1) and
               ($predicate.runDetails.metadata.invocationId == ("https://github.com/" + $repo + "/actions/runs/" + $run_id + "/attempts/" + $run_attempt)))' \
              <<< "$provenance_document"

            sbom_document="$(gh attestation verify "oci://$reference" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" \
              --cert-identity "https://github.com/$GH_REPO/.github/workflows/release.yml@refs/tags/$TAG" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --format json)"
            jq -e \
              --arg name "$name" \
              --arg digest "$digest" \
              --arg tag "$TAG" \
              --arg version "$VERSION" \
              --arg commit "$SOURCE_REF" \
              --arg platform "$platform" \
              --slurpfile local_sbom "$sbom" \
              'any(.[];
               . as $attestation |
               ($attestation.verificationResult.statement) as $statement |
               ($statement.predicate) as $predicate |
               ($statement.predicateType == "https://spdx.dev/Document/v2.3") and
               ([ $statement.subject[]? ] | length == 1) and
               ($statement.subject[0].name == $name) and
               ("sha256:" + $statement.subject[0].digest.sha256 == $digest) and
               ($predicate.spdxVersion == "SPDX-2.3") and
               ($predicate == $local_sbom[0]) and
               (($predicate.creationInfo.comment | fromjson) as $identity |
                ($identity.platform == $platform) and
                ($identity.digest == $digest) and
                ($identity.releaseTag == $tag) and
                ($identity.releaseVersion == $version) and
                ($identity.commitSha == $commit)))' \
              <<< "$sbom_document"
          done < <(jq -c '.subjects[]' container-attestation-subjects.json)
      - name: Reconcile release-index aliases from immutable digests
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -e \
            --arg schema "ralphie.publication-subjects.v1" \
            --arg image "ghcr.io/beremaran/ralphie" \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            '(.schema == $schema) and
             (.image == $image) and
             (.version == $version) and
             (.source_ref == $source_ref) and
             (.subjects | type == "array" and length == 2) and
             ([.subjects[].platform] | sort) == ["linux/amd64", "linux/arm64"] and
             ([.subjects[].platform] | unique | length == 2) and
             ([.subjects[].digest] | unique | length == 2) and
             (all(.subjects[]; (.platform == "linux/amd64" or .platform == "linux/arm64") and
                               (.digest | test("^sha256:[0-9a-f]{64}$")) and
                               (.reference == ($image + "@" + .digest))))' \
            publication-subjects.json > /dev/null

          # The persisted digests must still equal the candidate contract
          # digests staged by the uncredentialed build.
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) platform="linux/amd64" ;;
              arm64) platform="linux/arm64" ;;
              *) echo "Unsupported container architecture: $arch" >&2; exit 1 ;;
            esac
            subject_digest="$(jq -er --arg platform "$platform" \
              '.subjects[] | select(.platform == $platform) | .digest' publication-subjects.json)"
            contract_digest="$(jq -er '.digest' "container-candidates/ralphie-container-candidate-${VERSION}-${arch}/ralphie-container-${arch}.metadata.json")"
            test "$subject_digest" = "$contract_digest"
          done

          # The reconciliation plan carries exactly the validated tag plan's
          # index tags; the reconciler never derives an alias itself.
          jq -e --slurpfile tag_plan container-tag-plan.json \
            --arg schema "ralphie.container-reconcile-plan.v1" \
            '(.schema == $schema) and
             (.index_tags == $tag_plan[0].index_tags) and
             (.index.digest | test("^sha256:[0-9a-f]{64}$")) and
             ([.index_tags[] | select(contains("+"))] | length == 0)' \
            container-index/ralphie-reconcile-plan.json > /dev/null

          bun scripts/reconcile-container-registry.ts \
            --plan container-index/ralphie-reconcile-plan.json \
            --stage index
      # Rel20 exact release-handle and six-asset reconciliation. The release
      # carries exactly these six assets and nothing else; any missing, extra,
      # or mismatched asset or note is an explicit conflict. Draft retries
      # repair only this validated handle; published handles are read-only.
      - name: Upload assets and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
          RELEASE_ID: ${{ steps.release-handle.outputs.release_id }}
          UPLOAD_URL: ${{ steps.release-handle.outputs.upload_url }}
          RELEASE_STATE: ${{ steps.release-handle.outputs.state }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$RELEASE_STATE" = draft || test "$RELEASE_STATE" = published
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$UPLOAD_URL"

          # The exact six-asset set (rel20-release-contract): the four native
          # binaries plus the signed checksum manifest and its Sigstore
          # bundle. Any other asset on the release is an explicit conflict;
          # nothing is ever deleted, overwritten, ignored, or recreated.
          assets=(
            release-assets/ralphie-darwin-arm64
            release-assets/ralphie-darwin-x64
            release-assets/ralphie-linux-arm64
            release-assets/ralphie-linux-x64
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sigstore.json
          )

          # Re-read the exact release by ID and assert every validated handle
          # invariant: numeric id, release ID in the upload URL, validated
          # tag, validated source_ref, and a consistent draft/published state.
          assert_release_handle() {
            local expected_draft="$1" released
            released="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
            if ! jq -e \
              --arg id "$RELEASE_ID" \
              --arg tag "$TAG" \
              --arg ref "$SOURCE_REF" \
              --argjson draft "$expected_draft" \
              --arg upload_regex "^https://uploads\\.github\\.com/repos/[^/]+/[^/]+/releases/${RELEASE_ID}/assets\\{\\?name,label\\}$" \
              '(.id | tostring) == $id and
               .tag_name == $tag and
               .target_commitish == $ref and
               (.upload_url | type == "string") and
               (.upload_url | test($upload_regex)) and
               .draft == $draft and
               if $draft then .published_at == null else (.published_at | type == "string") end' \
              <<< "$released" > /dev/null; then
              echo "Release $RELEASE_ID re-read does not match the validated handle" >&2
              jq -r '"  id=" + ((.id // "missing") | tostring) + " tag_name=" + (.tag_name // "missing") + " target_commitish=" + (.target_commitish // "missing") + " draft=" + ((.draft // "missing") | tostring) + " published_at=" + ((.published_at // "missing") | tostring)' \
                <<< "$released" >&2
              exit 1
            fi
            printf '%s' "$released"
          }

          # Verify the release notes as handle content (never an uploadable
          # asset): non-empty and byte-identical to the notes GitHub generates
          # for the validated tag (createRelease used generate_notes: true).
          verify_release_notes() {
            local released="$1" body generated
            body="$(jq -er '.body | select(type == "string" and length > 0)' <<< "$released")" || {
              echo "Release $RELEASE_ID has empty or missing release notes" >&2
              exit 1
            }
            generated="$(gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -f tag_name="$TAG" \
              "repos/$GH_REPO/releases/generate-notes" \
              --jq '.body')"
            if [[ "$body" != "$generated" ]]; then
              echo "Release $RELEASE_ID notes do not match the generated notes for tag $TAG" >&2
              echo '--- notes on the release handle ---' >&2
              printf '%s\n' "$body" >&2
              echo "--- generated notes for $TAG ---" >&2
              printf '%s\n' "$generated" >&2
              exit 1
            fi
          }

          # rel20-release-contract checksum: SHA256SUMS is exactly four
          # entries in deterministic order ralphie-darwin-arm64,
          # ralphie-darwin-x64, ralphie-linux-arm64, ralphie-linux-x64; each
          # line is "<64-lowercase-hex>  <filename>" (two spaces), recomputed
          # from the exact staged binary bytes, with no sidecar, signature, or
          # note lines in the manifest.
          recomputed_manifest="$RUNNER_TEMP/SHA256SUMS.recomputed"
          : > "$recomputed_manifest"
          for asset in ralphie-darwin-arm64 ralphie-darwin-x64 ralphie-linux-arm64 ralphie-linux-x64; do
            test -s "release-assets/$asset"
            digest="$(sha256sum "release-assets/$asset" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$asset" >> "$recomputed_manifest"
          done
          if ! cmp --silent "$recomputed_manifest" release-assets/SHA256SUMS; then
            echo "SHA256SUMS does not match the exact staged binary digests" >&2
            diff -u "$recomputed_manifest" release-assets/SHA256SUMS >&2 || true
            exit 1
          fi
          manifest_line_count=0
          while IFS= read -r line; do
            manifest_line_count=$((manifest_line_count + 1))
            if [[ ! "$line" =~ ^[0-9a-f]{64}'  '(ralphie-darwin-arm64|ralphie-darwin-x64|ralphie-linux-arm64|ralphie-linux-x64)$ ]]; then
              echo "SHA256SUMS line $manifest_line_count violates the '<64-lowercase-hex>  <filename>' contract" >&2
              printf '  %s\n' "$line" >&2
              exit 1
            fi
          done < release-assets/SHA256SUMS
          if (( manifest_line_count != 4 )); then
            echo "SHA256SUMS must contain exactly four entries, found $manifest_line_count" >&2
            exit 1
          fi

          # rel20-release-contract signature: the Sigstore bundle signs
          # exactly the SHA256SUMS bytes and keeps the canonical bundle shape.
          # The pinned sigstore action already proved the OIDC cert identity
          # and issuer when it produced and verified this bundle in this run.
          bundle="release-assets/SHA256SUMS.sigstore.json"
          test -s "$bundle"
          if ! jq -e \
            '(.mediaType | type == "string") and
             (.messageSignature.messageDigest.algorithm == "SHA2_256") and
             (.messageSignature.messageDigest.digest | type == "string") and
             (.verificationMaterial | type == "object")' \
            "$bundle" > /dev/null; then
            echo "SHA256SUMS.sigstore.json is not a valid Sigstore bundle" >&2
            exit 1
          fi
          # Hex-encode the decoded digest bytes with coreutils only (od/tr);
          # xxd is not guaranteed on GitHub-hosted runners.
          signed_digest="$(jq -er '.messageSignature.messageDigest.digest' "$bundle" | base64 -d | od -An -tx1 -v | tr -d ' \n')"
          manifest_digest="$(sha256sum release-assets/SHA256SUMS | awk '{print $1}')"
          if [[ "$signed_digest" != "$manifest_digest" ]]; then
            echo "SHA256SUMS.sigstore.json signs a different manifest than the staged SHA256SUMS" >&2
            echo "  expected $manifest_digest, bundle has $signed_digest" >&2
            exit 1
          fi

          # Enumerate the assets on this exact release handle only. Any name
          # outside the six-asset set is an explicit conflict: never delete,
          # overwrite, ignore, or publish around it.
          upload_endpoint="${UPLOAD_URL%%\{*}"
          test "$upload_endpoint" != "$UPLOAD_URL"
          remote_assets="$RUNNER_TEMP/release-assets.json"
          gh api --paginate --slurp \
            "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            > "$remote_assets"
          extra_assets="$(jq -r \
            --argjson allowed '["ralphie-darwin-arm64","ralphie-darwin-x64","ralphie-linux-arm64","ralphie-linux-x64","SHA256SUMS","SHA256SUMS.sigstore.json"]' \
            '[.[][] | .name] | map(select(. as $name | ($allowed | index($name)) | not)) | .[]' \
            "$remote_assets")"
          if [[ -n "$extra_assets" ]]; then
            echo "Release $RELEASE_ID has assets outside the exact six-asset contract:" >&2
            printf '%s\n' "$extra_assets" | sed 's/^/  extra asset: /' >&2
            echo "An extra asset is an explicit conflict: refusing to delete, overwrite, ignore, or publish" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            test -f "$asset"
            asset_name="$(basename "$asset")"

            # Release assets are immutable by name. Never delete or replace
            # one: an existing asset is accepted only when its downloaded
            # bytes have exactly the same SHA-256 as the local bytes.
            existing_count="$(jq -r --arg name "$asset_name" \
              '[.[][] | select(.name == $name)] | length' "$remote_assets")"
            if (( existing_count > 1 )); then
              echo "Release contains duplicate assets named $asset_name" >&2
              exit 1
            fi

            if (( existing_count == 1 )); then
              existing_id="$(jq -er --arg name "$asset_name" \
                '[.[][] | select(.name == $name)][0].id' "$remote_assets")"
              existing_url="$(jq -er --arg name "$asset_name" \
                '[.[][] | select(.name == $name)][0].browser_download_url' "$remote_assets")"
              [[ "$existing_id" =~ ^[1-9][0-9]*$ ]]
              expected_url="https://github.com/$GH_REPO/releases/download/$TAG/$asset_name"
              test "$existing_url" = "$expected_url"
              downloaded="$RUNNER_TEMP/existing-$asset_name"
              if [[ "$RELEASE_STATE" == published ]]; then
                # Published assets must also prove the anonymous distribution
                # URL used by downstream clients before they are accepted.
                curl --fail --silent --show-error --location --retry 3 \
                  --output "$downloaded" "$existing_url"
              else
                # Draft assets are not anonymously downloadable. The
                # authenticated asset endpoint is used only for this internal
                # pre-publication reconciliation.
                gh api \
                  -H "Accept: application/octet-stream" \
                  "repos/$GH_REPO/releases/assets/$existing_id" \
                  > "$downloaded"
              fi
              local_digest="$(sha256sum "$asset" | awk '{print $1}')"
              existing_digest="$(sha256sum "$downloaded" | awk '{print $1}')"
              if [[ "$local_digest" != "$existing_digest" ]]; then
                echo "Existing release asset differs: $asset_name" >&2
                echo "  expected $local_digest, release has $existing_digest" >&2
                exit 1
              fi
              echo "Existing release asset matches: $asset_name"
              continue
            fi

            if [[ "$RELEASE_STATE" == published ]]; then
              echo "Published release $RELEASE_ID is missing asset $asset_name" >&2
              echo "A missing asset on a published release is an explicit conflict; refusing to upload, delete, or republish" >&2
              exit 1
            fi

            # A missing asset on a draft handle may be repaired: an
            # interrupted or partial upload is completed on this validated
            # release handle only. A concurrent upload or any upload error
            # fails closed; there is deliberately no overwrite path.
            curl --fail --silent --show-error --retry 3 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_endpoint?name=$asset_name" \
              > /dev/null
            echo "Uploaded missing release asset: $asset_name"
          done

          if [[ "$RELEASE_STATE" == published ]]; then
            # Read-only published reconciliation: re-read the exact release by
            # ID, verify tag/target, generated notes, and (above) every asset
            # digest, and succeed only when everything matches. No upload,
            # delete, unpublish, or release creation ever runs for a
            # published handle.
            released="$(assert_release_handle false)"
            verify_release_notes "$released"
            echo "Release $RELEASE_ID is already published; all six assets and notes match; no changes made"
            exit 0
          fi

          # Draft finalization: re-read the exact release by ID immediately
          # before the draft:false mutation and assert id, tag, source_ref,
          # upload URL, and the still-draft state. Any error before this
          # request leaves the release unpublished, and this PATCH is the
          # final release-state change this job performs.
          released="$(assert_release_handle true)"
          verify_release_notes "$released"
          gh api --method PATCH \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            --jq '.draft | select(. == false)' \
            > /dev/null
