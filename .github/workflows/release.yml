name: Release

on:
  # Run validation for every tag so an unsupported tag fails explicitly rather
  # than being ignored by the workflow trigger.
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (v<major>.<minor>.<patch>)"
        required: true
        type: string
      ref:
        description: "Full 40-character commit SHA targeted by the version tag"
        required: true
        type: string
      dry_run:
        description: "Validate and build artifacts without publishing a release or image"
        required: false
        default: true
        type: boolean

# Jobs must opt into their small, explicit permission set.
permissions: {}

env:
  BUN_VERSION: "1.3.14"

jobs:
  validate:
    name: Validate release context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-context.outputs.version }}
      tag: ${{ steps.release-context.outputs.tag }}
      source_ref: ${{ steps.release-context.outputs.source_ref }}
      dry_run: ${{ steps.release-context.outputs.dry_run }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          # A manual run must never silently check out the workflow's default
          # branch. The validation step below proves this ref is the tag's
          # commit before any later job can run.
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and resolve release context
        id: release-context
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail

          # This is the deliberately narrow release grammar. Numeric
          # components cannot have leading zeroes, and prerelease/build
          # suffixes are not release versions.
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $RELEASE_VERSION" >&2
            echo 'Expected v<major>.<minor>.<patch>, for example v0.1.0.' >&2
            exit 1
          fi

          if [[ "$RELEASE_DRY_RUN" != true && "$RELEASE_DRY_RUN" != false ]]; then
            echo "dry_run must resolve to true or false" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # A manual run must be started from the same protected tag it is
            # releasing; the input SHA is then checked against that tag below.
            if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_VERSION" ]]; then
              echo "workflow_dispatch must be run from the version tag $RELEASE_VERSION" >&2
              exit 1
            fi
            if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "workflow_dispatch ref must be a 40-character lowercase commit SHA" >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" != "refs/tags/$RELEASE_VERSION" ]]; then
            echo "The push ref is not the validated release tag" >&2
            exit 1
          fi

          # This is the invariant that makes the validated commit stable
          # through the build and publication jobs. A read-then-publish API
          # check cannot close the race with a tag update.
          package_version="$(jq -er '.version | select(type == "string")' package.json)"
          expected_version="${RELEASE_VERSION#v}"
          if [[ "$package_version" != "$expected_version" ]]; then
            echo "Release tag $RELEASE_VERSION does not match package.json version $package_version" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_PROTECTED" != true ]]; then
            echo "The release tag must be protected against updates and deletions" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_VERSION^{commit}" 2>/dev/null)" || {
            echo "Release tag $RELEASE_VERSION does not exist in the checkout" >&2
            exit 1
          }
          source_commit="$(git rev-parse --verify "${RELEASE_REF}^{commit}" 2>/dev/null)" || {
            echo "Release ref $RELEASE_REF is not a commit" >&2
            exit 1
          }

          if [[ "$source_commit" != "$tag_commit" ]]; then
            echo "Release ref $RELEASE_REF does not target $RELEASE_VERSION ($tag_commit)" >&2
            exit 1
          fi

          # Downstream jobs consume only these canonical values: the package
          # version and the immutable commit targeted by the tag.
          {
            echo "version=$package_version"
            echo "tag=$RELEASE_VERSION"
            echo "source_ref=$tag_commit"
            echo "dry_run=$RELEASE_DRY_RUN"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # Let every target report its result, while still making the matrix job
      # fail when any target fails so publish cannot proceed with a partial set.
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-14 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: linux-x64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native target architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            darwin-arm64) expected_os=Darwin; expected_arch=arm64 ;;
            darwin-x64) expected_os=Darwin; expected_arch=x86_64 ;;
            linux-arm64) expected_os=Linux; expected_arch=aarch64 ;;
            linux-x64) expected_os=Linux; expected_arch=x86_64 ;;
            *) echo "Unsupported native target: $TARGET" >&2; exit 1 ;;
          esac
          actual_os="$(uname -s)"
          actual_arch="$(uname -m)"
          if [[ "$actual_os" != "$expected_os" || "$actual_arch" != "$expected_arch" ]]; then
            echo "Runner $actual_os/$actual_arch does not match native target $TARGET" >&2
            exit 1
          fi

      - name: Build native binary
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.validate.outputs.source_ref }}
        run: >-
          bun run build -- --commit-sha "$RELEASE_COMMIT_SHA"
          --version "$RELEASE_VERSION"

      - name: Verify native binary format and architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary=dist/cli
          test -s "$binary"
          test -x "$binary"
          command -v file >/dev/null
          description="$(file -b "$binary")"

          case "$TARGET" in
            darwin-arm64)
              [[ "$description" == "Mach-O 64-bit executable arm64" ]]
              test "$(lipo -archs "$binary")" = arm64
              test "$(otool -l "$binary" | awk '
                $1 == "cmd" { command = $2 }
                command == "LC_BUILD_VERSION" && $1 == "platform" {
                  print $2
                  exit
                }
              ')" = 1
              ;;
            darwin-x64)
              [[ "$description" == "Mach-O 64-bit executable x86_64" ]]
              test "$(lipo -archs "$binary")" = x86_64
              test "$(otool -l "$binary" | awk '
                $1 == "cmd" { command = $2 }
                command == "LC_BUILD_VERSION" && $1 == "platform" {
                  print $2
                  exit
                }
              ')" = 1
              ;;
            linux-arm64)
              [[ "$description" == ELF* && "$description" == *"ARM aarch64"* ]]
              [[ "$description" == *"GNU/Linux"* ]]
              ;;
            linux-x64)
              [[ "$description" == ELF* && "$description" == *"x86-64"* ]]
              [[ "$description" == *"GNU/Linux"* ]]
              ;;
            *)
              echo "Unsupported native target: $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Verify native binary metadata
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          test -s dist/cli
          test -x dist/cli
          version_output="$RUNNER_TEMP/ralphie-version.txt"
          ./dist/cli --version > "$version_output"
          test -s "$version_output"
          version_json="$(./dist/cli --version --output json)"
          jq -e \
            --arg version "$EXPECTED_VERSION" \
            --arg commit_sha "$EXPECTED_COMMIT_SHA" \
            'type == "object" and .version == $version and .commitSha == $commit_sha' \
            <<< "$version_json" >/dev/null

      - name: Prepare and checksum release asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="ralphie-${TARGET}"
          checksum_file="${asset}.sha256"
          mv dist/cli "$asset"
          if [[ "$(uname -s)" == Darwin ]]; then
            digest="$(shasum -a 256 "$asset" | awk '{print $1}')"
          else
            digest="$(sha256sum "$asset" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$digest" "$asset" > "$checksum_file"
          test "$(awk '{print $1}' "$checksum_file")" = "$digest"

      # Artifacts are only staging. The token cannot publish a release asset.
      - name: Stage release asset and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            ralphie-${{ matrix.target }}
            ralphie-${{ matrix.target }}.sha256
          if-no-files-found: error
          # v4 artifacts are immutable; an attempted rerun must fail rather
          # than replace an artifact produced by another run.
          overwrite: false
          # Keep staged inputs through the protected-environment approval
          # window; 90 days is the maximum GitHub Actions artifact lifetime.
          retention-days: 90

  aggregate-release-metadata:
    name: Aggregate release metadata
    needs:
      - validate
      - build-binaries
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.build-binaries.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      # Use one exact artifact name per target. This prevents an untrusted
      # artifact matching a broad pattern from entering the release bundle.
      - name: Download darwin-arm64 staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-darwin-arm64
          path: release-staging/ralphie-${{ needs.validate.outputs.version }}-darwin-arm64
      - name: Download darwin-x64 staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-darwin-x64
          path: release-staging/ralphie-${{ needs.validate.outputs.version }}-darwin-x64
      - name: Download linux-arm64 staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-linux-arm64
          path: release-staging/ralphie-${{ needs.validate.outputs.version }}-linux-arm64
      - name: Download linux-x64 staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ralphie-${{ needs.validate.outputs.version }}-linux-x64
          path: release-staging/ralphie-${{ needs.validate.outputs.version }}-linux-x64

      - name: Verify binaries and create release metadata
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          bun scripts/create-release-metadata.ts \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit-sha "$SOURCE_REF" \
            --artifacts-dir release-staging \
            --output-dir release-bundle

      # This is the only native bundle consumed by the publisher. v4 artifact
      # names are immutable and include the validated package version.
      - name: Stage immutable release metadata bundle
        uses: actions/upload-artifact@v4
        with:
          name: ralphie-release-metadata-${{ needs.validate.outputs.version }}
          path: release-bundle
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  # This job deliberately has no registry credentials or write permissions.
  # Each matrix leg produces one tested, platform-specific candidate. The
  # protected publisher can later download these immutable artifacts and
  # promote the recorded digests without rebuilding from a moving ref.
  stage-container:
    name: Stage container ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
      IMAGE: ralphie:container-candidate-${{ matrix.arch }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # Both exporters consume this one BuildKit result. The Docker archive is
      # loaded for the smoke test; the OCI archive is the promotion input.
      - name: Build non-publishing container candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          build-args: |
            RALPHIE_VERSION=${{ needs.validate.outputs.version }}
            RALPHIE_COMMIT_SHA=${{ needs.validate.outputs.source_ref }}
            BUN_VERSION=${{ env.BUN_VERSION }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_ref }}
          push: false
          outputs: |
            type=docker,dest=/tmp/ralphie-container-${{ matrix.arch }}.docker.tar
            type=oci,dest=ralphie-container-${{ matrix.arch }}.oci.tar

      - name: Smoke-test entrypoint and inspect release metadata
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_REVISION: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          docker load --input "/tmp/ralphie-container-${ARCH}.docker.tar"

          license_label="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
          version_label="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          revision_label="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$license_label" = "MIT"
          test "$version_label" = "$EXPECTED_VERSION"
          test "$revision_label" = "$EXPECTED_REVISION"

          version_json="$(docker run --rm --platform "$PLATFORM" "$IMAGE" --version --output json)"
          jq -e --arg version "$EXPECTED_VERSION" --arg revision "$EXPECTED_REVISION" \
            '.version == $version and .commitSha == $revision' <<< "$version_json"

          runtime_config="$(docker image inspect "$IMAGE" --format '{{json .Config}}')"
          jq -e \
            '(.User == "65532:65532") and
             (.WorkingDir == "/home/nonroot") and
             (.Env | index("HOME=/home/nonroot") != null)' \
            <<< "$runtime_config" > /dev/null

          docker run --rm --platform "$PLATFORM" --entrypoint /bin/bash "$IMAGE" -c '
            set -eu
            test "$(id -u)" = 65532
            test "$(id -g)" = 65532
            test "$HOME" = /home/nonroot
            test "$(pwd)" = /home/nonroot
            command -v bash >/dev/null
            command -v git >/dev/null
            command -v gh >/dev/null
            command -v ssh >/dev/null
            command -v rg >/dev/null
            command -v fdfind >/dev/null
            git --version >/dev/null
            gh --version >/dev/null
            test -s /etc/ssl/certs/ca-certificates.crt
            state_dir="$HOME/.ralphie"
            test ! -e "$state_dir"
            mkdir -p "$state_dir"
            printf "smoke\\n" > "$state_dir/probe"
            test -s "$state_dir/probe"
          '

      # Candidate contract v1 for the final publisher:
      # - artifact: ralphie-container-candidate-<version>-<arch>
      # - archive: the platform-specific OCI archive below
      # - digest: the BuildKit image manifest digest
      # - source_ref/platform/archive_sha256: values the publisher must match
      # before promoting the archive. A failed build, smoke test, or metadata
      # check never reaches this step or the immutable artifact upload.
      - name: Write candidate digest and platform contract
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          archive="ralphie-container-${ARCH}.oci.tar"
          contract="ralphie-container-${ARCH}.metadata.json"
          test -s "$archive"
          digest="$(printf '%s\n' "$BUILD_DIGEST" | grep -E '^sha256:[0-9a-f]{64}$')"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f1)"
          artifact="ralphie-container-candidate-${VERSION}-${ARCH}"
          image_license="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
          image_version="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          jq -n \
            --arg schema "ralphie.container-candidate.v1" \
            --arg artifact "$artifact" \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            --arg platform "$PLATFORM" \
            --arg digest "$digest" \
            --arg format "oci-archive" \
            --arg archive "$archive" \
            --arg archive_sha256 "$archive_sha256" \
            --arg image_license "$image_license" \
            --arg image_version "$image_version" \
            --arg image_revision "$image_revision" \
            '{
              schema: $schema,
              artifact: $artifact,
              version: $version,
              source_ref: $source_ref,
              platform: $platform,
              digest: $digest,
              format: $format,
              archive: $archive,
              archive_sha256: $archive_sha256,
              image_license: $image_license,
              image_version: $image_version,
              image_revision: $image_revision
            }' \
            > "$contract"

      # v4 artifact names are immutable. The final publisher downloads the two
      # names from the contract above, verifies each archive_sha256 and digest,
      # and publishes only the matching linux/amd64 and linux/arm64 pair.
      - name: Upload tested container candidate
        uses: actions/upload-artifact@v4
        with:
          name: ralphie-container-candidate-${{ needs.validate.outputs.version }}-${{ matrix.arch }}
          path: ralphie-container-${{ matrix.arch }}.*
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish-npm:
    name: Publish npm package
    needs:
      - validate
      - aggregate-release-metadata
    if: needs.validate.outputs.dry_run == 'false' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.aggregate-release-metadata.result == 'success'
    # The validation job also rejects unqualified manual dispatches. Keep the
    # ref guard here so this publisher can never run from a branch, even if a
    # future change weakens another job's condition.
    runs-on: ubuntu-latest
    # One-time npm setup: in the package's npmjs.com settings, add the GitHub
    # Actions trusted publisher for owner beremaran, repository ralphie,
    # workflow release.yml, and environment release. This job intentionally
    # uses only GitHub's short-lived OIDC exchange and no registry secret.
    environment:
      name: release
      url: https://www.npmjs.com/package/@beremaran/ralphie
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      - name: Verify scoped package and release tag version
        id: npm-context
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Refusing npm publication: the workflow must run from a v* tag (got $GITHUB_REF)" >&2
            exit 1
          fi
          if [[ "$TAG" != v* ]]; then
            echo "Malformed npm release tag '$TAG': expected a tag beginning with v" >&2
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          # SemVer 2.0.0: numeric prerelease identifiers cannot have leading
          # zeroes, and every dot-separated identifier must be non-empty.
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ -z "$TAG_VERSION" || ! "$TAG_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "Malformed npm release tag '$TAG': expected a valid SemVer v<major>.<minor>.<patch> with optional prerelease/build metadata" >&2
            exit 1
          fi

          PACKAGE_NAME="$(jq -er '.name | select(type == "string")' package.json)"
          PACKAGE_VERSION="$(jq -er '.version | select(type == "string")' package.json)"
          if [[ "$PACKAGE_NAME" != @beremaran/ralphie ]]; then
            echo "Refusing npm publication for unscoped package $PACKAGE_NAME" >&2
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "npm release tag $TAG resolves to $TAG_VERSION, but package.json declares $PACKAGE_VERSION; normal and prerelease versions must match exactly" >&2
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      # npm trusted publishing requires a recent npm CLI and Node runtime.
      # Do not configure setup-node with a registry or auth file: npm obtains
      # publish authorization from the GitHub OIDC token instead of a long-lived token.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install npm trusted-publishing client
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1 --no-audit --no-fund
          test "$(npm --version)" = 11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and smoke-test packed package
        run: bun run package:check

      - name: Publish scoped package with npm provenance
        run: npm publish --provenance --access public

      - name: Verify exact package from npm registry
        env:
          VERSION: ${{ steps.npm-context.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_SPEC="@beremaran/ralphie@$VERSION"
          METADATA_FILE="$RUNNER_TEMP/ralphie-npm-metadata.json"
          METADATA_ERROR="$RUNNER_TEMP/ralphie-npm-metadata.error"
          MAX_ATTEMPTS=6

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1)); do
            smoke_status=0
            bun run package:check -- --registry --package-spec "$PACKAGE_SPEC" || smoke_status=$?

            if (( smoke_status == 0 )); then
              if ! npm view "$PACKAGE_SPEC" name version --json > "$METADATA_FILE" 2> "$METADATA_ERROR"; then
                if ! grep -Eq 'E404|404 Not Found' "$METADATA_FILE" "$METADATA_ERROR"; then
                  echo "npm registry lookup failed for $PACKAGE_SPEC; not treating it as propagation" >&2
                  cat "$METADATA_ERROR" >&2 || true
                  exit 1
                fi
                if (( attempt == MAX_ATTEMPTS )); then
                  echo "npm registry metadata did not propagate for $PACKAGE_SPEC" >&2
                  cat "$METADATA_ERROR" >&2 || true
                  exit 1
                fi
                echo "npm registry metadata is still propagating; retrying registry smoke (attempt $((attempt + 1))/$MAX_ATTEMPTS)" >&2
                sleep 10
                continue
              fi
              if ! jq -e --arg name @beremaran/ralphie --arg version "$VERSION" \
                '.name == $name and .version == $version' "$METADATA_FILE" > /dev/null; then
                echo "npm registry returned unexpected metadata for $PACKAGE_SPEC" >&2
                cat "$METADATA_FILE" >&2
                exit 1
              fi
              exit 0
            fi

            # A failed exact lookup is the only retryable condition: npm's
            # package metadata/tarball may still be propagating. Once exact
            # metadata exists, a smoke failure is a package defect and must
            # fail the release rather than retrying or accepting another name.
            if npm view "$PACKAGE_SPEC" name version --json > "$METADATA_FILE" 2> "$METADATA_ERROR"; then
              if ! jq -e --arg name @beremaran/ralphie --arg version "$VERSION" \
                '.name == $name and .version == $version' "$METADATA_FILE" > /dev/null; then
                echo "npm registry returned unexpected metadata for $PACKAGE_SPEC" >&2
                cat "$METADATA_FILE" >&2
                exit 1
              fi
              echo "Registry metadata exists for $PACKAGE_SPEC, but the package smoke check failed; refusing to retry" >&2
              exit "$smoke_status"
            fi
            if ! grep -Eq 'E404|404 Not Found' "$METADATA_FILE" "$METADATA_ERROR"; then
              echo "npm registry lookup failed for $PACKAGE_SPEC; not treating it as propagation" >&2
              cat "$METADATA_ERROR" >&2 || true
              exit "$smoke_status"
            fi

            if (( attempt == MAX_ATTEMPTS )); then
              echo "npm registry package $PACKAGE_SPEC did not propagate after $MAX_ATTEMPTS attempts" >&2
              cat "$METADATA_ERROR" >&2 || true
              exit "$smoke_status"
            fi
            echo "npm registry package $PACKAGE_SPEC is still propagating; retrying registry smoke (attempt $((attempt + 1))/$MAX_ATTEMPTS)" >&2
            sleep 10
          done

  push-container:
    name: Push container image
    needs:
      - validate
      - stage-container
      - aggregate-release-metadata
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.stage-container.result == 'success' &&
        needs.aggregate-release-metadata.result == 'success' &&
        needs.validate.outputs.dry_run == 'false'
      }}
    runs-on: ubuntu-latest
    # Container publication is separately downstream of the metadata check.
    # Its protected environment prevents a retry from bypassing validation.
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/packages/container/ralphie
    permissions:
      packages: write
    steps:
      - name: Download tested container candidates
        uses: actions/download-artifact@v4
        with:
          pattern: ralphie-container-candidate-${{ needs.validate.outputs.version }}-*
          path: container-candidates
          merge-multiple: true

      # Validate every candidate before the first registry write. The archive
      # hash and the recorded image metadata bind the promotion input to the
      # validated version and commit, even when this job is retried.
      - name: Verify candidate metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) platform="linux/amd64" ;;
              arm64) platform="linux/arm64" ;;
              *) echo "Unsupported container architecture: $arch" >&2; exit 1 ;;
            esac

            contract="container-candidates/ralphie-container-${arch}.metadata.json"
            archive="ralphie-container-${arch}.oci.tar"
            jq -e \
              --arg schema "ralphie.container-candidate.v1" \
              --arg artifact "ralphie-container-candidate-${VERSION}-${arch}" \
              --arg version "$VERSION" \
              --arg source_ref "$SOURCE_REF" \
              --arg platform "$platform" \
              --arg archive "$archive" \
              '(.schema == $schema) and
               (.artifact == $artifact) and
               (.version == $version) and
               (.source_ref == $source_ref) and
               (.platform == $platform) and
               (.format == "oci-archive") and
               (.archive == $archive) and
               (.image_license == "MIT") and
               (.image_version == $version) and
               (.image_revision == $source_ref) and
               (.digest | strings | test("^sha256:[0-9a-f]{64}$")) and
               (.archive_sha256 | strings | test("^[0-9a-f]{64}$"))' \
              "$contract" > /dev/null
            test -s "container-candidates/$archive"
            expected_sha256="$(jq -er '.archive_sha256' "$contract")"
            actual_sha256="$(sha256sum "container-candidates/$archive" | cut -d ' ' -f1)"
            test "$actual_sha256" = "$expected_sha256"
          done

      - name: Install skopeo
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes skopeo
          fi

      - name: Inspect OCI metadata before promotion
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="container-candidates/ralphie-container-${arch}.oci.tar"
            contract="container-candidates/ralphie-container-${arch}.metadata.json"
            expected_digest="$(jq -er '.digest' "$contract")"
            actual_digest="$(skopeo inspect --format '{{.Digest}}' "oci-archive:$archive")"
            license_label="$(skopeo inspect --format '{{ index .Labels "org.opencontainers.image.licenses" }}' "oci-archive:$archive")"
            version_label="$(skopeo inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "oci-archive:$archive")"
            revision_label="$(skopeo inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "oci-archive:$archive")"
            test "$actual_digest" = "$expected_digest"
            test "$license_label" = "MIT"
            test "$version_label" = "$VERSION"
            test "$revision_label" = "$SOURCE_REF"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The normalized package version is the canonical tag. The minor,
      # latest, and source-revision tags are explicit aliases; metadata-action
      # is told not to infer latest so a prerelease can never receive it.
      - name: Derive container tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/beremaran/ralphie
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.validate.outputs.tag, '-') }}
            type=raw,value=sha-${{ needs.validate.outputs.source_ref }}

      # Promote the inspected OCI archives, rather than rebuilding with a
      # different ref. All version/revision inputs remain the release-gate
      # outputs on retries.
      - name: Push inspected container images
        env:
          IMAGE: ghcr.io/beremaran/ralphie
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="container-candidates/ralphie-container-${arch}.oci.tar"
            platform_tag="$IMAGE:${VERSION}-${arch}"
            expected_digest="$(jq -er '.digest' "container-candidates/ralphie-container-${arch}.metadata.json")"
            skopeo copy --authfile "$HOME/.docker/config.json" --retry-times 3 \
              "oci-archive:$archive" "docker://$platform_tag"
            actual_digest="$(skopeo inspect --authfile "$HOME/.docker/config.json" \
              --retry-times 3 --format '{{.Digest}}' "docker://$platform_tag")"
            test "$actual_digest" = "$expected_digest"
          done

          while IFS= read -r tag; do
            test -n "$tag"
            docker manifest create "$tag" \
              "$IMAGE:${VERSION}-amd64" \
              "$IMAGE:${VERSION}-arm64"
            docker manifest push "$tag"
          done <<< "$IMAGE_TAGS"

  publish:
    name: Publish release
    needs:
      - validate
      - build-binaries
      - stage-container
      - aggregate-release-metadata
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.build-binaries.result == 'success' &&
        needs.stage-container.result == 'success' &&
        needs.aggregate-release-metadata.result == 'success' &&
        needs.validate.outputs.dry_run == 'false' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    # Configure this environment in repository settings with required
    # reviewers. Its protection gate is the only approval before publication.
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          persist-credentials: false

      # Checkout must precede artifact download: checkout's clean step would
      # otherwise remove the untracked final release-assets directory.
      - name: Download verified release metadata bundle
        uses: actions/download-artifact@v4
        with:
          name: ralphie-release-metadata-${{ needs.validate.outputs.version }}
          path: release-assets
          merge-multiple: false

      - name: Verify release metadata and exact assets
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          jq -e \
            --arg schema "ralphie.release-metadata.v1" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg commit "$SOURCE_REF" \
            '(.schema == $schema) and
             (.tag == $tag) and
             (.version == $version) and
             (.commit == $commit) and
             (.commit | test("^[0-9a-f]{40}$")) and
             (.assets | (type == "array" and length == 4 and
              ((map(select((.name | type) == "string" and (.sha256 | type) == "string"))) | length == 4))) and
             ([.assets[].name] | sort) == ["ralphie-darwin-arm64", "ralphie-darwin-x64", "ralphie-linux-arm64", "ralphie-linux-x64"] and
             ([.assets[].sha256] | all(test("^[0-9a-f]{64}$")))' \
            release-assets/release-metadata.json > /dev/null
          jq -r '.assets[] | "\(.sha256)  \(.name)"' \
            release-assets/release-metadata.json > "$RUNNER_TEMP/release-metadata-sums"
          cmp --silent "$RUNNER_TEMP/release-metadata-sums" release-assets/SHA256SUMS
          for asset in \
            ralphie-darwin-arm64 \
            ralphie-darwin-x64 \
            ralphie-linux-arm64 \
            ralphie-linux-x64; do
            test -s "release-assets/$asset"
          done
          (cd release-assets && sha256sum --check SHA256SUMS)

      # Recompute the canonical manifest from the final bytes in the
      # immutable metadata bundle. The aggregation manifest must match this
      # fresh computation before anything can be published.
      - name: Collect binaries and create SHA256SUMS
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          manifest="$RUNNER_TEMP/SHA256SUMS"
          : > "$manifest"
          for asset in \
            ralphie-darwin-arm64 \
            ralphie-darwin-x64 \
            ralphie-linux-arm64 \
            ralphie-linux-x64; do
            test -s "release-assets/$asset"
            digest="$(sha256sum "release-assets/$asset" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$asset" >> "$manifest"
          done
          cmp --silent "$manifest" release-assets/SHA256SUMS
          test "$(wc -l < "$manifest" | tr -d '[:space:]')" = 4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      - name: Install dependencies for SBOM validation
        run: bun install --frozen-lockfile

      # Generate only after the aggregation job has copied and renamed the
      # binaries into their final release-assets names. The wrapper verifies
      # those bytes, the exact release metadata, and the validated checkout.
      - name: Generate and validate deterministic SPDX SBOMs
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          bun_version="$(bun --version)"
          test "$bun_version" = "$BUN_VERSION"
          bun scripts/create-sboms.ts \
            --assets-dir release-assets \
            --output-dir release-assets \
            --source-dir . \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit-sha "$SOURCE_REF" \
            --bun-version "$bun_version" \
            --build-tool-version "$bun_version" \
            --build-command "bun run build -- --commit-sha $SOURCE_REF --version $VERSION"

      # Keep non-secret digest evidence for the exact final paths below. The
      # preceding metadata gate and this fresh hash both cover final bytes.
      - name: Record final attestation subject digests
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$SOURCE_REF"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          bun_version="$(bun --version)"
          test "$bun_version" = "$BUN_VERSION"
          subjects='[]'
          for asset in ralphie-darwin-arm64 ralphie-darwin-x64 ralphie-linux-arm64 ralphie-linux-x64; do
            path="release-assets/$asset"
            test -s "$path"
            digest="$(sha256sum "$path" | awk '{print $1}')"
            expected="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .sha256' release-assets/release-metadata.json)"
            test "$digest" = "$expected"
            subjects="$(jq --arg path "$path" --arg name "$asset" --arg digest "$digest" '. + [{path: $path, name: $name, algorithm: "sha256", digest: $digest}]' <<< "$subjects")"
          done
          jq -n \
            --arg schema "ralphie.release-attestation-subjects.v1" \
            --arg tag "$TAG" --arg version "$VERSION" --arg commit "$SOURCE_REF" \
            --arg workflow "Release" --arg workflow_file ".github/workflows/release.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg bun_version "$bun_version" \
            --arg build_command "bun run build -- --commit-sha $SOURCE_REF --version $VERSION" \
            --argjson subjects "$subjects" \
            '{schema: $schema, tag: $tag, version: $version, commit: $commit,
              workflow: $workflow, workflow_file: $workflow_file, workflow_ref: $workflow_ref,
              build: {bun_version: $bun_version, build_tool: "Bun", build_tool_version: $bun_version, build_command: $build_command},
              subjects: $subjects}' > release-assets/attestation-subjects.json

      # Attest each final renamed binary independently. A missing subject makes
      # the action fail, and the immutable pin prevents action ref drift.
      - name: Attest darwin-arm64 final binary
        id: attest_darwin_arm64
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: release-assets/ralphie-darwin-arm64
          show-summary: true
      - name: Attest darwin-x64 final binary
        id: attest_darwin_x64
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: release-assets/ralphie-darwin-x64
          show-summary: true
      - name: Attest linux-arm64 final binary
        id: attest_linux_arm64
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: release-assets/ralphie-linux-arm64
          show-summary: true
      - name: Attest linux-x64 final binary
        id: attest_linux_x64
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: release-assets/ralphie-linux-x64
          show-summary: true

      - name: Verify all binary attestations exist
        env:
          ATTESTATION_IDS: ${{ steps.attest_darwin_arm64.outputs.attestation-id }} ${{ steps.attest_darwin_x64.outputs.attestation-id }} ${{ steps.attest_linux_arm64.outputs.attestation-id }} ${{ steps.attest_linux_x64.outputs.attestation-id }}
        run: |
          set -euo pipefail
          read -r -a attestation_ids <<< "$ATTESTATION_IDS"
          test "${#attestation_ids[@]}" = 4
          for attestation_id in "${attestation_ids[@]}"; do test -n "$attestation_id"; done
          test "$(printf '%s\n' "${attestation_ids[@]}" | wc -l)" = 4
          test "$(printf '%s\n' "${attestation_ids[@]}" | sort -u | wc -l)" = 4

      # Verify the generated documents and the attestations against the exact
      # files that the release uploader will consume. The API count is checked
      # as well as the cryptographic gh verification: a valid attestation for
      # an old filename, source checkout, or another run is not sufficient.
      # This gate must remain before the release handle is created.
      - name: Verify final SBOMs and build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$SOURCE_REF"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          test "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$
          test "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$

          expected_binaries=$'ralphie-darwin-arm64\nralphie-darwin-x64\nralphie-linux-arm64\nralphie-linux-x64'
          actual_binaries="$(find release-assets -maxdepth 1 -type f -name 'ralphie-*' ! -name '*.sha256' ! -name '*.sbom.spdx.json' -printf '%f\n' | sort)"
          test "$actual_binaries" = "$expected_binaries"
          expected_sboms=$'ralphie-darwin-arm64.sbom.spdx.json\nralphie-darwin-x64.sbom.spdx.json\nralphie-linux-arm64.sbom.spdx.json\nralphie-linux-x64.sbom.spdx.json'
          actual_sboms="$(find release-assets -maxdepth 1 -type f -name '*.sbom.spdx.json' -printf '%f\n' | sort)"
          test "$actual_sboms" = "$expected_sboms"

          attestation_response="$RUNNER_TEMP/ralphie-attestations.json"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            binary="release-assets/ralphie-$target"
            sbom="$binary.sbom.spdx.json"
            test "$(find release-assets -maxdepth 1 -type f -name "ralphie-$target" | wc -l | tr -d '[:space:]')" = 1
            test "$(find release-assets -maxdepth 1 -type f -name "ralphie-$target.sbom.spdx.json" | wc -l | tr -d '[:space:]')" = 1
            test -s "$binary"
            test -s "$sbom"

            digest="$(sha256sum "$binary" | awk '{print $1}')"
            size="$(wc -c < "$binary" | tr -d '[:space:]')"
            jq -e \
              --arg tag "$TAG" \
              --arg version "$VERSION" \
              --arg commit "$SOURCE_REF" \
              --arg target "$target" \
              --arg binary "ralphie-$target" \
              --arg digest "$digest" \
              --arg size "$size" \
              ' . as $document |
               ($document.creationInfo.comment | fromjson) as $metadata |
               ($document.spdxVersion == "SPDX-2.3") and
               ($document.name == ("ralphie-" + $version + "-" + $target)) and
               ($metadata.releaseTag == $tag) and
               ($metadata.releaseVersion == $version) and
               ($metadata.commitSha == $commit) and
               ($metadata.target == $target) and
               ($metadata.finalBinaryFilename == $binary) and
               ($metadata.finalBinarySha256 == $digest) and
               ($metadata.finalBinarySize == ($size | tonumber)) and
               ([ $document.files[]? | select(.fileName == $binary) ] | length == 1) and
               ([ $document.files[]? | select(.fileName == $binary) | .checksums[]? |
                  select(.algorithm == "SHA256") | .checksumValue ] == [$digest])' \
              "$sbom" > /dev/null

            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GH_REPO/attestations/sha256:$digest?per_page=100" > "$attestation_response"
            jq -e \
              '([.[].attestations[]] | length == 1) and
               ([.[].attestations[]] | .[0].bundle != null)' \
              "$attestation_response" > /dev/null

            verification="$(
              gh attestation verify "$binary" \
                --repo "$GH_REPO" \
                --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
                --source-ref "refs/tags/$TAG" \
                --cert-identity "https://github.com/$GH_REPO/.github/workflows/release.yml@refs/tags/$TAG" \
                --cert-oidc-issuer https://token.actions.githubusercontent.com \
                --predicate-type https://slsa.dev/provenance/v1 \
                --format json
            )"
            jq -e \
              --arg digest "$digest" \
              --arg binary "ralphie-$target" \
              --arg repo "$GH_REPO" \
              --arg tag "$TAG" \
              --arg commit "$SOURCE_REF" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              'if length != 1 then false else
               .[0] as $attestation |
               ($attestation.verificationResult.statement) as $statement |
               ($statement.predicate) as $predicate |
               ($statement.predicateType == "https://slsa.dev/provenance/v1") and
               ([ $statement.subject[]? ] | length == 1) and
               ($statement.subject[0].name == $binary) and
               ($statement.subject[0].digest.sha256 == $digest) and
               ($predicate.buildDefinition.externalParameters.workflow.repository == ("https://github.com/" + $repo)) and
               ($predicate.buildDefinition.externalParameters.workflow.path == ".github/workflows/release.yml") and
               ($predicate.buildDefinition.externalParameters.workflow.ref == ("refs/tags/" + $tag)) and
               ($predicate.buildDefinition.internalParameters.github.event_name == $event) and
               ([ $predicate.buildDefinition.resolvedDependencies[]? |
                  select(.uri == ("git+https://github.com/" + $repo + "@refs/tags/" + $tag) and
                         .digest.gitCommit == $commit) ] | length == 1) and
               ($predicate.runDetails.metadata.invocationId == ("https://github.com/" + $repo + "/actions/runs/" + $run_id + "/attempts/" + $run_attempt))
               end' \
              <<< "$verification"
          done

      # Sign the exact manifest that will be published. Ambient GitHub OIDC
      # credentials stay inside the Sigstore action and are never written to
      # the checkout, build context, logs, or release assets.
      - name: Sign and verify SHA256SUMS with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: release-assets/SHA256SUMS
          verify: true
          verify-cert-identity: "https://github.com/beremaran/ralphie/.github/workflows/release.yml@refs/tags/${{ needs.validate.outputs.tag }}"
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false

      # Create the draft release handle only after final collection, SBOM,
      # attestation, and signing have succeeded. Any later upload failure still
      # leaves this validated handle as a recoverable draft.
      - name: Create or reuse draft release handle
        id: release-handle
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = process.env.RELEASE_TAG;
            const sourceRef = process.env.SOURCE_REF;
            const { owner, repo } = context.repo;
            if (!tag || !sourceRef) throw new Error("Validated release tag and source ref are required");

            const getRelease = async () => {
              try {
                return (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              } catch (error) {
                if (error.status === 404) return undefined;
                throw error;
              }
            };
            let release = await getRelease();
            if (!release) {
              try {
                release = (await github.rest.repos.createRelease({
                  owner, repo, tag_name: tag, target_commitish: sourceRef,
                  name: tag, generate_notes: true, draft: true,
                })).data;
              } catch (error) {
                if (error.status !== 422) throw error;
                release = await getRelease();
                if (!release) throw new Error("Release creation conflicted but no release could be found");
              }
            }
            if (release.tag_name !== tag) throw new Error(`Release tag mismatch: expected ${tag}, got ${release.tag_name}`);
            if (release.target_commitish !== sourceRef) throw new Error(`Release target mismatch: expected ${sourceRef}, got ${release.target_commitish}`);
            if (typeof release.draft !== "boolean") throw new Error("Release draft state is missing or invalid");
            if (release.draft && release.published_at !== null) throw new Error("A draft release must not have a published timestamp");
            if (!release.draft && typeof release.published_at !== "string") throw new Error("A published release must have a published timestamp");
            if (!Number.isSafeInteger(release.id) || release.id <= 0) throw new Error(`Release id is invalid: ${release.id}`);
            const uploadUrlPattern = /^https:\/\/uploads\.github\.com\/repos\/[^/]+\/[^/]+\/releases\/([1-9][0-9]*)\/assets\{\?name,label\}$/;
            if (typeof release.upload_url !== "string") throw new Error("Release upload_url is missing or invalid");
            const uploadUrlMatch = release.upload_url.match(uploadUrlPattern);
            if (uploadUrlMatch === null || Number(uploadUrlMatch[1]) !== release.id) throw new Error("Release upload_url is missing or invalid");
            const state = release.draft ? "draft" : "published";
            core.setOutput("release_id", String(release.id));
            core.setOutput("upload_url", release.upload_url);
            core.setOutput("state", state);

      # Keep this explicit list in sync with the checksum collector. Existing
      # release assets are reconciled by digest; no rerun may replace bytes.
      - name: Upload assets and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_ID: ${{ steps.release-handle.outputs.release_id }}
          UPLOAD_URL: ${{ steps.release-handle.outputs.upload_url }}
          RELEASE_STATE: ${{ steps.release-handle.outputs.state }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$RELEASE_STATE" = draft || test "$RELEASE_STATE" = published
          test "$RELEASE_ID" =~ ^[1-9][0-9]*$
          test -n "$UPLOAD_URL"

          assets=(
            release-assets/ralphie-darwin-arm64
            release-assets/ralphie-darwin-arm64.sha256
            release-assets/ralphie-darwin-x64
            release-assets/ralphie-darwin-x64.sha256
            release-assets/ralphie-linux-arm64
            release-assets/ralphie-linux-arm64.sha256
            release-assets/ralphie-linux-x64
            release-assets/ralphie-linux-x64.sha256
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sigstore.json
            release-assets/release-metadata.json
            release-assets/ralphie-darwin-arm64.sbom.spdx.json
            release-assets/ralphie-darwin-x64.sbom.spdx.json
            release-assets/ralphie-linux-arm64.sbom.spdx.json
            release-assets/ralphie-linux-x64.sbom.spdx.json
            release-assets/attestation-subjects.json
          )
          upload_endpoint="${UPLOAD_URL%%\{*}"
          test "$upload_endpoint" != "$UPLOAD_URL"
          existing_assets="$RUNNER_TEMP/release-assets.json"
          gh api --paginate --slurp \
            "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            > "$existing_assets"
          for asset in "${assets[@]}"; do
            test -f "$asset"
            asset_name="$(basename "$asset")"

            # Release assets are immutable by name. Never delete or replace
            # one: an existing asset is accepted only when its downloaded
            # bytes have exactly the same SHA-256 as the local bytes.
            existing_count="$(jq -r --arg name "$asset_name" \
              '[.[][] | select(.name == $name)] | length' "$existing_assets")"
            if (( existing_count > 1 )); then
              echo "Release contains duplicate assets named $asset_name" >&2
              exit 1
            fi

            if (( existing_count == 1 )); then
              existing_id="$(jq -er --arg name "$asset_name" \
                '[.[][] | select(.name == $name)][0].id' "$existing_assets")"
              existing_url="$(jq -er --arg name "$asset_name" \
                '[.[][] | select(.name == $name)][0].browser_download_url' "$existing_assets")"
              test "$existing_id" =~ ^[1-9][0-9]*$
              expected_url="https://github.com/$GH_REPO/releases/download/$TAG/$asset_name"
              test "$existing_url" = "$expected_url"
              downloaded="$RUNNER_TEMP/existing-$asset_name"
              if [[ "$RELEASE_STATE" == published ]]; then
                # Published assets must also prove the anonymous distribution
                # URL used by downstream clients before they are accepted.
                curl --fail --silent --show-error --location --retry 3 \
                  --output "$downloaded" "$existing_url"
              else
                # Draft assets are not anonymously downloadable. The
                # authenticated asset endpoint is used only for this internal
                # pre-publication reconciliation.
                gh api \
                  -H "Accept: application/octet-stream" \
                  "repos/$GH_REPO/releases/assets/$existing_id" \
                  > "$downloaded"
              fi
              local_digest="$(sha256sum "$asset" | awk '{print $1}')"
              existing_digest="$(sha256sum "$downloaded" | awk '{print $1}')"
              if [[ "$local_digest" != "$existing_digest" ]]; then
                echo "Existing release asset differs: $asset_name" >&2
                exit 1
              fi
              echo "Existing release asset matches: $asset_name"
              continue
            fi

            # A missing asset may be added. A concurrent upload or any upload
            # error fails closed; there is deliberately no overwrite path.
            curl --fail --silent --show-error --retry 3 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_endpoint?name=$asset_name" \
              > /dev/null
          done

          if [[ "$RELEASE_STATE" == published ]]; then
            echo "Release $RELEASE_ID is already published; all existing assets match"
            exit 0
          fi

          # Publishing is deliberately last. Any failure before this request
          # leaves the release created by the handle as a draft.
          gh api --method PATCH \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            --jq '.draft | select(. == false)' \
            > /dev/null
