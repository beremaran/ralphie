name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  BUN_VERSION: "1.3.14"

jobs:
  publish:
    name: Validate, build, and publish the npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Validate tag and package version
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/validate-npm-context.ts

      - name: Build the package
        run: bun run build:package

      - name: Smoke-check the packed tarball
        run: bun run package:check

      - name: Publish to npm
        run: npm publish --access public --provenance
