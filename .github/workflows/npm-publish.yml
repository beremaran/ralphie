name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  publish:
    name: Validate, build, and publish the npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Validate tag and package version
        run: bun scripts/validate-npm-context.ts

      - name: Build the package
        run: bun run build:package

      - name: Smoke-check the packed tarball
        run: bun run package:check

      - name: Configure npm authentication
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        run: bun publish --access public